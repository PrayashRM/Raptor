# ==============================================================================
# docker-compose.prod.yml — Production Environment
#
# Differences from development:
#   - Uses production Dockerfile stage (gunicorn, no hot reload)
#   - NO postgres container (uses AWS RDS)
#   - NO pgadmin container (never expose in production)
#   - Redis included (required for rate limiting + job queue in prod)
#   - Worker included
#   - Stricter resource limits
#   - No bind mounts (code baked into image)
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml exec backend alembic upgrade head
# ==============================================================================

name: reslens-prod

networks:
  reslens_prod_network:
    driver: bridge

volumes:
  redis_prod_data:
    driver: local

services:

  # ----------------------------------------------------------------------------
  # Backend — Production
  # Uses gunicorn + uvicorn workers (no hot reload)
  # Code is baked into the Docker image (no bind mount)
  # Points to external AWS RDS PostgreSQL (no local postgres container)
  # ----------------------------------------------------------------------------
  backend:
    image: ${DOCKER_REGISTRY}/reslens-backend:${IMAGE_TAG:-latest}
    container_name: reslens-backend-prod
    restart: always

    environment:
      APP_ENV: production
      DEBUG: "false"

      # These come from production .env or AWS Secrets Manager / ECS task def
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS}

      REDIS_URL: redis://redis:6379/0

      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_BUCKET: ${R2_BUCKET}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY}
      R2_SECRET_KEY: ${R2_SECRET_KEY}
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL}

      OPENAI_API_KEY: ${OPENAI_API_KEY}
      CHAT_MODEL: ${CHAT_MODEL}
      EMBED_MODEL: ${EMBED_MODEL}

      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME}

      OPENALEX_BASE_URL: ${OPENALEX_BASE_URL}
      SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY}
      UNPAYWALL_EMAIL: ${UNPAYWALL_EMAIL}

      RAG_SERVICE_URL: ${RAG_SERVICE_URL}
      RAG_SERVICE_API_KEY: ${RAG_SERVICE_API_KEY}

    ports:
      - "8000:8000"

    networks:
      - reslens_prod_network

    depends_on:
      redis:
        condition: service_healthy

    # In production, migrations are run as a separate one-off command
    # before deploying the new version, not on every container start
    # See: Makefile prod-migrate target
    command: >
      gunicorn app.main:app
      --workers 4
      --worker-class uvicorn.workers.UvicornWorker
      --bind 0.0.0.0:8000
      --access-logfile -
      --error-logfile -
      --timeout 120

    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  # ----------------------------------------------------------------------------
  # Redis — Required in production for rate limiting + job queue
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: reslens-redis-prod
    restart: always

    volumes:
      - redis_prod_data:/data

    networks:
      - reslens_prod_network

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD}

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # ----------------------------------------------------------------------------
  # ARQ Worker — Production async task worker
  # ----------------------------------------------------------------------------
  worker:
    image: ${DOCKER_REGISTRY}/reslens-backend:${IMAGE_TAG:-latest}
    container_name: reslens-worker-prod
    restart: always

    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      SECRET_KEY: ${SECRET_KEY}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_BUCKET: ${R2_BUCKET}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY}
      R2_SECRET_KEY: ${R2_SECRET_KEY}
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME}
      RAG_SERVICE_URL: ${RAG_SERVICE_URL}
      RAG_SERVICE_API_KEY: ${RAG_SERVICE_API_KEY}

    networks:
      - reslens_prod_network

    depends_on:
      redis:
        condition: service_healthy

    command: arq app.workers.settings.WorkerSettings

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G