  #     <<: *backend-env
  #   volumes:
  #     - ./app:/app/app:rw
  #   networks:
  #     - reslens_network
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
