# ==============================================================================
# alembic.ini — Alembic migration configuration
#
# This file is the entry point for Alembic.
# It tells Alembic:
#   1. Where the migration scripts live (script_location)
#   2. How to connect to the database (sqlalchemy.url)
#   3. Logging configuration
#
# NOTE: sqlalchemy.url is set to a placeholder here.
#       The actual URL is injected at runtime from the DATABASE_URL_SYNC
#       environment variable in app/db/migrations/env.py.
#       This prevents hardcoding credentials in this file.
#
# Usage:
#   alembic upgrade head                           → run all pending migrations
#   alembic revision --autogenerate -m "message"   → create new migration
#   alembic downgrade -1                           → rollback one step
#   alembic history --verbose                      → show migration history
#   alembic current                                → show current version
# ==============================================================================

[alembic]

# Path to the migration scripts directory
# Relative to the directory where alembic commands are run (project root)
script_location = app/db/migrations

# Adds the project root to sys.path when Alembic runs
# This makes "from app.models import Base" work in env.py
prepend_sys_path = .

# Template for new migration file names
# Produces: 20250315_1422_add_users_table.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# Timezone for file_template timestamps
timezone = UTC

# Placeholder — overridden in env.py from environment variable
# NEVER put real credentials here
sqlalchemy.url = postgresql://placeholder:placeholder@localhost:5432/placeholder

# Truncate long revision IDs in console output for readability
truncate_slug_length = 40

# Use batch mode for migrations
# Required for certain operations on SQLite (not PostgreSQL) but
# good practice to keep enabled for portability
# revision_environment = false

# Max length of characters to apply to the "slug" field
# max_length of message slug
# slug_length = 40

# Set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# Encoding for script files
output_encoding = utf-8

[post_write_hooks]
# Run ruff formatter on newly generated migration files
# Keeps migration code consistent with the rest of the project
hooks = ruff
ruff.type = exec
ruff.executable = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

# ==============================================================================
# Logging configuration
# ==============================================================================

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
# Set to INFO to see SQL statements executed during migrations
# Set to WARNING for normal operation
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S