[project]
name = "Backend"
version = "1.0.0"
description = "ResearchRAG Platform — Production API v1"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "gunicorn>=22.0.0",

    # Database — async
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",

    # Database — sync (Alembic migrations only)
    "psycopg2-binary>=2.9.9",

    # pgvector
    "pgvector>=0.3.0",

    # Pydantic
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "email-validator>=2.0.0",

    # Security
    "bcrypt>=4.1.0",
    "pyjwt[crypto]>=2.8.0",
    "python-multipart>=0.0.9",

    # HTTP client
    "httpx>=0.27.0",

    # Email
    "resend>=2.0.0",
    "jinja2>=3.1.4",

    # Storage
    "boto3>=1.34.0",

    # Utilities
    "python-ulid>=2.7.0",
    "python-magic>=0.4.27",
    "structlog>=24.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "anyio>=4.4.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 88
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]