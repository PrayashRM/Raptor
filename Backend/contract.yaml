  # ============================================================================
  # WEBSOCKET
  # ============================================================================

  /ws:
    get:
      operationId: websocket_connect
      tags:
        - WebSocket
      summary: Establish multiplexed WebSocket connection
      description: |
        Upgrades the HTTP connection to a persistent WebSocket. A single
        connection per authenticated user session handles all real-time
        communication:

        - **Chat streaming** — Send messages, receive streamed LLM response
          chunks, and receive the final `done` frame with cited sources.
        - **RAG status push** — Receive `rag_status` events when the pipeline
          completes or fails for papers in the user's library.
        - **Notification delivery** — Receive `notification` push frames in
          real time without polling.

        ---

        ### Authentication Handshake

        The connection is unauthenticated at the HTTP upgrade level. The client
        must send an `auth` frame as the **first message** immediately after
        the connection is established. Any other frame received before
        successful authentication is silently dropped.

        ```json
        // Step 1 — Client sends auth frame
        {
          "type": "auth",
          "token": "<access_token>"
        }

        // Step 2a — Server confirms authentication
        {
          "type": "auth_ok",
          "user_id": "01J9XK234PQRSTUVWXYZ"
        }

        // Step 2b — Server rejects authentication → connection closed
        {
          "type": "auth_error",
          "code": "INVALID_TOKEN",
          "message": "The provided access token is invalid or expired."
        }
        ```

        ---

        ### Frame Catalogue

        #### Client → Server Frames

        **Subscribe to paper chat channel**
        ```json
        {
          "type": "subscribe_chat",
          "paper_id": "01J9XK234PQRSTUVWXYZ"
        }
        ```
        Subscribe to receive `chunk`, `done`, and `rag_status` frames for a
        specific paper. A user may subscribe to multiple papers simultaneously.
        The server validates library membership on subscribe — non-members
        receive an `error` frame.

        **Send chat message**
        ```json
        {
          "type": "message",
          "paper_id": "01J9XK234PQRSTUVWXYZ",
          "content": "What is the role of positional encoding in the Transformer?",
          "client_message_id": "client-uuid-for-dedup"
        }
        ```
        The `client_message_id` is a client-generated UUID used for
        client-side deduplication. The server echoes it in the first `chunk`
        frame so the frontend can correlate the response to the outgoing message
        before a `message_id` is assigned.

        **Unsubscribe from paper chat channel**
        ```json
        {
          "type": "unsubscribe_chat",
          "paper_id": "01J9XK234PQRSTUVWXYZ"
        }
        ```

        **Ping (keepalive)**
        ```json
        { "type": "ping" }
        ```
        Server responds with `{ "type": "pong" }`. Client should send a ping
        every 30 seconds to prevent proxy-level connection timeouts.

        ---

        #### Server → Client Frames

        **Authentication success**
        ```json
        {
          "type": "auth_ok",
          "user_id": "01J9XK234PQRSTUVWXYZ"
        }
        ```

        **Authentication failure (connection closed after this frame)**
        ```json
        {
          "type": "auth_error",
          "code": "INVALID_TOKEN",
          "message": "The provided access token is invalid or expired."
        }
        ```

        **Streamed answer chunk**
        ```json
        {
          "type": "chunk",
          "paper_id": "01J9XK234PQRSTUVWXYZ",
          "message_id": "01J9XCHAT001MSGUUID",
          "client_message_id": "client-uuid-for-dedup",
          "content": "Positional encoding is added to the input embeddings to"
        }
        ```
        Multiple `chunk` frames are emitted sequentially, each carrying a
        partial content string. The frontend appends each chunk to the
        in-progress message bubble.

        **Stream complete — final answer frame**
        ```json
        {
          "type": "done",
          "paper_id": "01J9XK234PQRSTUVWXYZ",
          "message_id": "01J9XCHAT001MSGUUID",
          "client_message_id": "client-uuid-for-dedup",
          "answer": "Positional encoding is added to the input embeddings to inject information about the position of tokens in the sequence...",
          "sources": [
            {
              "chunk_text": "Since our model contains no recurrence and no convolution, in order for the model to make use of the order of the sequence...",
              "page_number": 6,
              "section": "Positional Encoding",
              "confidence_score": 0.94
            }
          ],
          "tokens_used": 840
        }
        ```
        Sent once after all `chunk` frames. The frontend renders source
        citation cards below the completed answer.

        **RAG status push event**
        ```json
        {
          "type": "rag_status",
          "paper_id": "01J9XK234PQRSTUVWXYZ",
          "status": "ready",
          "progress": 100
        }
        ```
        Pushed to all authenticated connections subscribed to this paper when
        the pipeline status transitions. Used to drive live progress UI and to
        notify Case 3 subscriber queues (users waiting for a shared pipeline).

        **Notification push event**
        ```json
        {
          "type": "notification",
          "payload": {
            "notification_id": "01J9XNOTIF001UUID",
            "type": "rag_ready",
            "title": "RAG Ready: Attention Is All You Need",
            "body": "The RAG index for your paper is ready. Start chatting now.",
            "paper_id": "01J9XK234PQRSTUVWXYZ",
            "created_at": "2025-03-10T14:22:00Z"
          }
        }
        ```
        Pushed unprompted at any time. Frontend increments bell badge unread
        count. If the WebSocket is not open, notification persists in DB and
        loads on next `GET /notifications`.

        **Server-side error frame**
        ```json
        {
          "type": "error",
          "code": "RAG_NOT_READY",
          "message": "RAG is not ready for this paper. Subscribe to rag_status events for updates.",
          "paper_id": "01J9XK234PQRSTUVWXYZ"
        }
        ```
        Sent in response to invalid client frames (e.g. sending a `message`
        frame for a paper whose RAG is not ready, or subscribing to a paper
        not in the user's library). Connection remains open.

        **Pong (keepalive response)**
        ```json
        { "type": "pong" }
        ```

        ---

        ### Connection Lifecycle

        1. Client opens `WSS /api/v1/ws`
        2. Client sends `auth` frame with access token
        3. Server responds `auth_ok` or `auth_error` + closes
        4. Client subscribes to paper chat channels as needed
        5. Client sends `ping` every 30 seconds
        6. On access token expiry: client calls `POST /auth/refresh` (REST),
           then sends a new `auth` frame on the existing WS connection to
           re-authenticate without reconnecting
        7. On server-initiated close: client implements exponential backoff
           reconnect (1s → 2s → 4s → 8s → max 60s)

        ---

        ### Rate Limiting on WebSocket
        Chat message frames: 60 messages/minute per user.
        Exceeding this limit causes the server to send an `error` frame with
        code `RATE_LIMITED` and drop the excess message. Connection is not closed.

        ---

        ### Security
        - Access token supplied in the `auth` frame is validated against the
          same JWT verification logic as REST endpoints.
        - Connection is closed with code `4001` on auth failure.
        - Connection is closed with code `4002` on server-detected token replay
          (refresh token rotation violation).
        - Idle connections with no activity for 5 minutes (no ping received)
          are closed by the server with code `1000` (normal closure).

      security:
        - BearerAuth: []
      responses:
        '101':
          description: |
            Switching Protocols. WebSocket connection established. The client
            must immediately send the `auth` frame before any other frames
            are processed.
        '401':
          description: |
            HTTP upgrade rejected. This occurs only if the server rejects
            the upgrade at the HTTP layer (rare). Authentication is
            handled post-upgrade via the auth frame handshake.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalError'




# ==============================================================================
# RATE LIMITING SUMMARY
# ==============================================================================
# Applied per authenticated user (or per IP for unauthenticated endpoints).
# All rate-limited responses include X-RateLimit-* headers.
# 429 responses include Retry-After header.
#
# Route Class                          Limit
# ─────────────────────────────────────────────────────────────────────────────
# Auth endpoints                       10 req / 15 min per IP
#   POST /auth/signup
#   GET  /auth/verify-email
#   POST /auth/resend-verification
#   POST /auth/login
#   POST /auth/refresh
#   POST /auth/forgot-password
#   POST /auth/reset-password
#   PATCH /users/me/password
#
# Upload / Ingest endpoints            20 req / hour per user
#   POST /papers/upload
#   POST /papers/ingest
#   POST /papers/{id}/ingest
#
# Discovery search                     30 req / min per user
#   GET  /discovery/search
#
# WebSocket chat messages              60 messages / min per user (in-frame)
#
# General authenticated endpoints      120 req / min per user
#   All other /papers/*, /dashboard/*,
#   /collections/*, /notifications/*,
#   /users/me, /admin/*, /ws upgrade
#
# Public unauthenticated endpoints     120 req / min per IP
#   GET /health
#   GET /health/ready
#   GET /stats
#
# Health probes                        Exempt from rate limiting
#   GET /health
#   GET /health/ready
# ==============================================================================

