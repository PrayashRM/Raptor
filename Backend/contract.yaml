openapi: 3.0.0

# ==============================================================================
# INFO
# ==============================================================================
info:
  title: ResearchRAG Platform API
  version: 1.0.0
  description: |
    ## ResearchRAG Platform — Production API v1

    ResearchRAG is a multi-tenant research paper ingestion and retrieval-augmented
    generation (RAG) platform. Users can upload research papers or discover them
    via an integrated academic search layer, trigger asynchronous RAG pipeline
    builds, and conduct persistent, memory-aware conversations grounded in the
    paper's content.

    ### Core Capabilities
    - **Auth** — Email/password authentication with JWT access + refresh token
      rotation, email verification, and password reset flows.
    - **Paper Ingestion** — Two ingestion paths: direct file upload
      (PDF/DOCX/TXT/XML ≤ 50 MB) and DOI/URL-based ingestion from the discovery
      layer. Global deduplication by DOI (external papers) and SHA-256 content
      hash (uploads).
    - **RAG Pipeline** — Asynchronous pipeline: parse → chunk → embed → index.
      Status tracked per paper. Real-time status updates delivered over the
      multiplexed WebSocket connection.
    - **Persistent Chat** — One rolling conversation session per (user, paper)
      pair. Full in-conversation memory with rolling summarisation. Streamed
      responses delivered over WebSocket with cited source chunks.
    - **Discovery** — Federated academic search across third-party APIs
      (OpenAlex, Semantic Scholar, Unpaywall). Results annotated with platform
      RAG status in real time.
    - **Library & Organisation** — Personal library scoped via saved_papers.
      User-defined tags. Private collections (folders). Cursor-based pagination
      throughout.
    - **Notifications** — In-app notification system. Delivered over WebSocket
      when the connection is open; persisted in DB for retrieval when offline.
    - **Admin** — Platform management endpoints: user administration, paper
      moderation, platform statistics, and system architecture manifest.
    - **Observability** — Per-paper pipeline trace endpoint. Health liveness and
      readiness probes.

    ### Authentication
    All protected endpoints require a valid JWT access token supplied as a
    Bearer token in the `Authorization` header. Access tokens are short-lived
    (15 minutes). Use `POST /auth/refresh` to obtain a new access token via the
    HttpOnly refresh token cookie. Refresh tokens rotate on every use.

    ### WebSocket
    A single multiplexed WebSocket connection at `GET /ws` handles chat
    streaming, RAG status updates, and notification delivery. The connection
    must be authenticated via a first-message auth handshake before any other
    frames are processed.

    ### Versioning
    This document describes API version **v1**. All endpoints are prefixed
    `/api/v1`. Breaking changes will be introduced under `/api/v2` with a
    documented migration guide.

    ### OAuth2
    > **Note — reserved for v2:** Google and GitHub OAuth2 social login
    > integration is architecturally planned but intentionally excluded from v1
    > to keep the authentication surface small and auditable.

    ### Webhooks
    > **Note — reserved for v2:** Outbound webhook delivery (e.g. RAG-ready
    > callbacks to external systems) is a known future extension point and is
    > excluded from v1.

    ### Chunked Upload
    > **Note — reserved for v1.1:** Resumable chunked file upload for papers
    > approaching the 50 MB limit. v1 supports single-shot multipart upload only.

  termsOfService: https://researchrag.example.com/terms
  contact:
    name: ResearchRAG Platform Support
    email: support@researchrag.example.com
    url: https://researchrag.example.com/support
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

# ==============================================================================
# SERVERS
# ==============================================================================
servers:
  - url: https://api.researchrag.example.com/api/v1
    description: Production server
  - url: https://staging-api.researchrag.example.com/api/v1
    description: Staging server — mirrors production data shape, safe for
      integration testing
  - url: http://localhost:8000/api/v1
    description: Local development server

# ==============================================================================
# TAGS
# ==============================================================================
tags:
  - name: Auth
    description: |
      Authentication and session management. Email/password signup, login,
      email verification, password reset, JWT refresh, and logout flows.
  - name: Users
    description: |
      Authenticated user profile management. Read and update the currently
      authenticated user's profile fields.
  - name: Papers
    description: |
      Core paper resource. Upload, ingest from DOI/URL, retrieve, update
      metadata, manage library membership, tags, pipeline trace, and chat
      history operations.
  - name: Chat
    description: |
      REST companions to the WebSocket chat channel. Retrieve persisted chat
      history for a (user, paper) session and clear conversation history.
      Active message exchange occurs exclusively over WebSocket.
  - name: Discovery
    description: |
      Federated academic paper search across third-party APIs. Results are
      annotated with platform RAG status. Discovered papers can be saved to
      the user's library or ingested immediately.
  - name: Collections
    description: |
      Personal paper collections (folders). Create, rename, delete collections
      and manage their paper membership.
  - name: Notifications
    description: |
      In-app notification management. Notifications are delivered over
      WebSocket when online and persisted in the database for retrieval.
  - name: Dashboard
    description: |
      Unified user dashboard feed. Returns the authenticated user's full paper
      library with scope filters, sort, search, tag, and collection filtering.
  - name: Admin
    description: |
      Platform administration. Restricted to users with role `admin`. Covers
      user management, paper moderation, platform statistics, and the system
      architecture manifest.
  - name: System
    description: |
      Platform-level public endpoints. Includes liveness/readiness health
      probes and public platform statistics.
  - name: WebSocket
    description: |
      Multiplexed WebSocket connection. Handles chat streaming, RAG status
      push events, and notification delivery over a single persistent
      connection per authenticated user session. See the WebSocket Message
      Catalogue in the contract description above each endpoint.

# ==============================================================================
# SECURITY SCHEMES
# ==============================================================================
security:
  - BearerAuth: []

components:

  securitySchemes:

    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Short-lived JWT access token. Lifetime: 15 minutes.
        Obtain via `POST /auth/login` or `POST /auth/refresh`.
        Supply as: `Authorization: Bearer <access_token>`

    RefreshTokenCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: |
        Long-lived refresh token stored in an HttpOnly, Secure, SameSite=Strict
        cookie. Lifetime: 30 days. Rotates on every use. Supply implicitly via
        browser cookie jar to `POST /auth/refresh`, `POST /auth/logout`, and
        `POST /auth/logout-all`.

# ==============================================================================
# REUSABLE COMPONENTS
# ==============================================================================

  # ----------------------------------------------------------------------------
  # SCHEMAS
  # ----------------------------------------------------------------------------
  schemas:

    # --------------------------------------------------------------------------
    # PRIMITIVES & SHARED
    # --------------------------------------------------------------------------

    CursorPagination:
      type: object
      description: Cursor-based pagination envelope returned on all list endpoints.
      required:
        - next_cursor
        - has_more
        - limit
      properties:
        next_cursor:
          type: string
          nullable: true
          description: |
            Base64-encoded composite cursor (sort field value + record ID of the
            last item in the current page). Pass as `?cursor=` on the next
            request. Null when there are no further pages.
          example: eyJpZCI6IjAxSjlYSzIzNFBRUlNUVVZXWFlaIiwic29ydF92YWx1ZSI6IjIwMjUtMDEtMTUifQ==
        has_more:
          type: boolean
          description: Whether additional pages exist beyond the current response.
          example: true
        limit:
          type: integer
          description: Number of items returned in this page.
          example: 20

    ErrorResponse:
      type: object
      description: |
        RFC 7807-inspired standard error envelope. Every non-2xx response from
        this API returns this shape. The `code` field is a machine-readable
        constant the client switches on. The `message` field is human-readable.
        The `details` field carries field-level validation errors or additional
        structured context.

        ### Canonical Error Codes
        | Code | HTTP Status | Description |
        |---|---|---|
        | `UNAUTHORIZED` | 401 | Missing or invalid access token |
        | `TOKEN_EXPIRED` | 401 | Access token has expired — refresh required |
        | `FORBIDDEN` | 403 | Authenticated but insufficient permissions |
        | `EMAIL_NOT_VERIFIED` | 403 | Account exists but email not yet verified |
        | `NOT_FOUND` | 404 | Requested resource does not exist |
        | `VALIDATION_ERROR` | 422 | Request body or parameter validation failed |
        | `RATE_LIMITED` | 429 | Rate limit exceeded — see Retry-After header |
        | `DUPLICATE_PAPER` | 409 | Paper already exists (matched by DOI or hash) |
        | `FILE_TOO_LARGE` | 413 | Upload exceeds 50 MB limit |
        | `UNSUPPORTED_FORMAT` | 415 | File type not accepted (PDF/DOCX/TXT/XML only) |
        | `RAG_PROCESSING_FAILED` | 500 | RAG pipeline encountered an unrecoverable error |
        | `RAG_NOT_READY` | 409 | Operation requires RAG to be ready; current status returned |
        | `INTERNAL_ERROR` | 500 | Unhandled server error |
        | `SERVICE_UNAVAILABLE` | 503 | Upstream dependency unreachable |
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Machine-readable error code constant.
              example: PAPER_NOT_FOUND
            message:
              type: string
              description: Human-readable description of the error.
              example: The requested paper does not exist.
            details:
              type: object
              nullable: true
              description: |
                Structured additional context. For `VALIDATION_ERROR`, this is
                a map of field names to error messages. For other errors, this
                may carry additional diagnostic information.
              additionalProperties: true
              example:
                file: Exceeds the 50 MB maximum file size limit.
                year_from: Must be a 4-digit integer between 1000 and 2100.
            request_id:
              type: string
              description: |
                Unique trace identifier for this request. Include this value
                when reporting issues to support.
              example: req_01J9XK234PQRSTUVWXYZ

    # --------------------------------------------------------------------------
    # AUTH SCHEMAS
    # --------------------------------------------------------------------------

    SignupRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          description: Display name shown throughout the platform.
          example: Dr. Aisha Patel
        email:
          type: string
          format: email
          maxLength: 254
          description: Primary email address. Used for login and verification.
          example: aisha.patel@university.edu
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          description: |
            Must be at least 8 characters. Backend enforces strength rules
            (at least one uppercase, one lowercase, one digit, one special
            character). Never returned in any response.
          example: "S3cure!Pass#2025"
        institution:
          type: string
          maxLength: 200
          nullable: true
          description: Optional institutional affiliation.
          example: MIT CSAIL

    SignupResponse:
      type: object
      required:
        - user_id
        - email
        - message
      properties:
        user_id:
          type: string
          format: uuid
          example: 01J9XK234PQRSTUVWXYZ
        email:
          type: string
          format: email
          example: aisha.patel@university.edu
        message:
          type: string
          example: Account created. A verification email has been sent to
            aisha.patel@university.edu. The link expires in 24 hours.

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: aisha.patel@university.edu
        password:
          type: string
          format: password
          example: "S3cure!Pass#2025"

    LoginResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
        - user
      properties:
        access_token:
          type: string
          description: Short-lived JWT. Lifetime 15 minutes (900 seconds).
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        token_type:
          type: string
          enum: [bearer]
          example: bearer
        expires_in:
          type: integer
          description: Access token lifetime in seconds.
          example: 900
        user:
          $ref: '#/components/schemas/UserProfile'

    RefreshResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
          description: |
            New short-lived JWT. The refresh token cookie is simultaneously
            rotated — the old refresh token is invalidated and a new HttpOnly
            cookie is set in the response.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        token_type:
          type: string
          enum: [bearer]
          example: bearer
        expires_in:
          type: integer
          description: New access token lifetime in seconds.
          example: 900

    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: aisha.patel@university.edu

    ResetPasswordRequest:
      type: object
      required:
        - token
        - new_password
      properties:
        token:
          type: string
          description: |
            Single-use reset token from the password reset email link.
            Expires in 1 hour.
          example: prst_01J9XK234PQRSTUVWXYZ_a1b2c3d4
        new_password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          example: "NewS3cure!Pass#2025"

    MessageResponse:
      type: object
      description: Generic success acknowledgement with no data payload.
      required:
        - message
      properties:
        message:
          type: string
          example: Operation completed successfully.

    # --------------------------------------------------------------------------
    # USER SCHEMAS
    # --------------------------------------------------------------------------

    UserProfile:
      type: object
      description: |
        Authenticated user's profile. The `role` field defaults to `user`.
        Admin role is assigned out-of-band and checked at the middleware layer.
      required:
        - user_id
        - name
        - email
        - role
        - email_verified
        - created_at
      properties:
        user_id:
          type: string
          format: uuid
          example: 01J9XK234PQRSTUVWXYZ
        name:
          type: string
          example: Dr. Aisha Patel
        email:
          type: string
          format: email
          description: |
            Immutable after verification. Changing email requires a new
            verification flow (v2 roadmap).
          example: aisha.patel@university.edu
        avatar_url:
          type: string
          format: uri
          nullable: true
          description: |
            URL to profile avatar image. May point to Gravatar, a CDN asset,
            or any valid HTTPS image URL. No server-side upload in v1.
          example: https://gravatar.com/avatar/abc123
        institution:
          type: string
          nullable: true
          maxLength: 200
          example: MIT CSAIL
        role:
          type: string
          enum:
            - user
            - admin
          description: |
            User role. `admin` grants access to `/admin/*` endpoints. Defaults
            to `user` on signup. Extended roles reserved for future versions.
          example: user
        email_verified:
          type: boolean
          description: |
            Whether the user has verified their email address. Unverified users
            receive 403 EMAIL_NOT_VERIFIED on all protected routes.
          example: true
        created_at:
          type: string
          format: date-time
          example: "2025-01-15T10:30:00Z"

    UpdateProfileRequest:
      type: object
      description: |
        Partial update — all fields are optional. Only supplied fields are
        updated. At least one field must be present.
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: Dr. Aisha M. Patel
        avatar_url:
          type: string
          format: uri
          nullable: true
          example: https://cdn.researchrag.example.com/avatars/aisha.jpg
        institution:
          type: string
          maxLength: 200
          nullable: true
          example: Stanford HAI

    ChangePasswordRequest:
      type: object
      required:
        - current_password
        - new_password
      properties:
        current_password:
          type: string
          format: password
          example: "S3cure!Pass#2025"
        new_password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          example: "NewS3cure!Pass#2025"

    # --------------------------------------------------------------------------
    # PAPER SCHEMAS
    # --------------------------------------------------------------------------

    RagStatus:
      type: string
      enum:
        - none
        - processing
        - ready
        - failed
      description: |
        Lifecycle status of the RAG pipeline for this paper.
        - `none` — Paper record exists but pipeline has not been triggered.
        - `processing` — Pipeline is actively running. Poll `GET /papers/{id}/status`
          or subscribe via WebSocket for `rag_status` push events.
        - `ready` — RAG index is built. Chat is available.
        - `failed` — Pipeline encountered an unrecoverable error. Check
          `GET /papers/{id}/pipeline-trace` for step-level detail.
      example: ready

    Author:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: Ashish Vaswani
        affiliation:
          type: string
          nullable: true
          example: Google Brain
        orcid:
          type: string
          nullable: true
          description: ORCID identifier if available from metadata extraction.
          example: "0000-0002-1825-0097"

    ChunkPreview:
      type: object
      description: A representative text chunk from the RAG index, returned
        in paper detail responses when rag_status is ready.
      required:
        - section
        - text
        - page_number
      properties:
        section:
          type: string
          example: Introduction
        text:
          type: string
          example: Attention mechanisms have become an integral part of compelling
            sequence modelling and transduction models...
        page_number:
          type: integer
          nullable: true
          example: 2

    PaperSummary:
      type: object
      description: |
        Lightweight paper representation used in list responses (dashboard,
        discovery, collection membership). Omits chunk_preview and full
        pipeline details.
      required:
        - paper_id
        - title
        - rag_status
        - source
        - created_at
      properties:
        paper_id:
          type: string
          format: uuid
          example: 01J9XK234PQRSTUVWXYZ
        doi:
          type: string
          nullable: true
          example: "10.48550/arXiv.1706.03762"
        title:
          type: string
          example: "Attention Is All You Need"
        authors:
          type: array
          items:
            $ref: '#/components/schemas/Author'
        year:
          type: integer
          nullable: true
          example: 2017
        journal:
          type: string
          nullable: true
          example: Advances in Neural Information Processing Systems
        source:
          type: string
          enum:
            - upload
            - external_api
          description: How this paper entered the platform.
          example: external_api
        rag_status:
          $ref: '#/components/schemas/RagStatus'
        is_in_library:
          type: boolean
          description: Whether the requesting user has this paper in their library.
          example: true
        tags:
          type: array
          items:
            type: string
          description: User's own tags on this paper (empty if not in library).
          example:
            - transformer
            - attention
        chat_message_count:
          type: integer
          description: Total messages in this user's conversation with this paper.
          example: 12
        saved_at:
          type: string
          format: date-time
          nullable: true
          description: When the user added this paper to their library.
          example: "2025-01-15T10:30:00Z"
        last_chatted_at:
          type: string
          format: date-time
          nullable: true
          description: When the user last sent a message in this paper's chat.
          example: "2025-03-10T14:22:00Z"

    PaperDetail:
      type: object
      description: |
        Full paper representation returned by `GET /papers/{id}`. Designed to
        power the paper detail page in a single round-trip. Includes all fields
        from PaperSummary plus chunk preview, collection membership, file URL,
        and extraction metadata.
      allOf:
        - $ref: '#/components/schemas/PaperSummary'
        - type: object
          properties:
            abstract:
              type: string
              nullable: true
              example: We propose a new simple network architecture, the Transformer,
                based solely on attention mechanisms...
            venue:
              type: string
              nullable: true
              example: NeurIPS 2017
            url:
              type: string
              format: uri
              nullable: true
              description: Link to the original paper at source (arXiv, DOI resolver, etc).
              example: https://arxiv.org/abs/1706.03762
            file_url:
              type: string
              format: uri
              nullable: true
              description: |
                Pre-signed storage URL for direct PDF access. Valid for 15 minutes
                from the time of the `GET /papers/{id}` response. Null if the paper
                has been bookmarked but not yet ingested (file not fetched).
                Refresh by calling `GET /papers/{id}` again.
              example: https://r2.researchrag.example.com/papers/01J9XK234.pdf?X-Signature=abc&Expires=1715420400
            content_hash:
              type: string
              nullable: true
              description: SHA-256 hash of the raw file bytes. Used for deduplication
                of uploaded papers. Null for external papers deduplicated by DOI.
              example: "a3f5c8e1d2b7..."
            extraction_method:
              type: string
              nullable: true
              enum:
                - native_text
                - ocr
              description: |
                How text was extracted from the document during the parse pipeline step.
                `native_text` for PDFs with selectable text. `ocr` for scanned/image PDFs.
                Null if pipeline has not run.
              example: native_text
            collections:
              type: array
              description: Collections (folders) this paper belongs to, scoped to the
                requesting user.
              items:
                type: object
                required:
                  - collection_id
                  - name
                properties:
                  collection_id:
                    type: string
                    format: uuid
                    example: 01J9XK999COLLECTIONS
                  name:
                    type: string
                    example: My Reading List
            chunk_preview:
              type: array
              nullable: true
              description: |
                First 3 representative text chunks from the RAG index.
                Populated only when rag_status is `ready`. Null otherwise.
              items:
                $ref: '#/components/schemas/ChunkPreview'
            uploaded_by:
              type: string
              format: uuid
              nullable: true
              description: |
                User ID of the user who first introduced this paper to the platform.
                Exposed in this response for admin-adjacent contexts only.
                Regular frontend clients should not surface this field in UI.
              example: 01J9XK111UPLOADER
            updated_at:
              type: string
              format: date-time
              example: "2025-03-10T14:22:00Z"

    PaperStatusResponse:
      type: object
      description: Lightweight status poll response for the RAG pipeline.
      required:
        - paper_id
        - rag_status
        - progress
      properties:
        paper_id:
          type: string
          format: uuid
          example: 01J9XK234PQRSTUVWXYZ
        rag_status:
          $ref: '#/components/schemas/RagStatus'
        progress:
          type: integer
          minimum: 0
          maximum: 100
          description: |
            Estimated pipeline completion percentage. 0 when status is `none`.
            100 when status is `ready` or `failed`. Increments through pipeline
            steps during `processing`. Drives frontend progress UI honestly
            without fabricating steps.
          example: 65
        current_step:
          type: string
          nullable: true
          enum:
            - queued
            - parse
            - chunk
            - embed
            - index
          description: Active pipeline step during `processing`. Null otherwise.
          example: embed
        error_message:
          type: string
          nullable: true
          description: Human-readable failure reason when rag_status is `failed`.
          example: null

    UploadPaperResponse:
      type: object
      description: Returned immediately after a successful paper upload.
        The RAG pipeline is triggered asynchronously.
      required:
        - paper_id
        - rag_status
        - message
      properties:
        paper_id:
          type: string
          format: uuid
          example: 01J9XK234PQRSTUVWXYZ
        rag_status:
          $ref: '#/components/schemas/RagStatus'
        deduplicated:
          type: boolean
          description: |
            True if this paper was matched to an existing platform record by
            content hash (DOI match for ingest endpoint). When true, no new
            pipeline is triggered if rag_status is already `ready`.
          example: false
        message:
          type: string
          example: Paper received. RAG pipeline queued. Poll GET /papers/{id}/status
            or subscribe via WebSocket for real-time updates.

    IngestPaperRequest:
      type: object
      description: Request body for DOI or URL-based paper ingestion from the
        discovery layer or any external source.
      required:
        - source
      properties:
        source:
          type: string
          enum:
            - doi
            - url
          description: |
            Ingestion source type.
            - `doi` — Supply the `doi` field. Backend resolves full text via
              Unpaywall/OpenAlex and fetches the file.
            - `url` — Supply the `url` field. Backend fetches the file directly.
          example: doi
        doi:
          type: string
          nullable: true
          description: Required when source is `doi`. DOI string without resolver prefix.
          example: "10.48550/arXiv.1706.03762"
        url:
          type: string
          format: uri
          nullable: true
          description: Required when source is `url`. Must be a publicly accessible
            direct link to a PDF/DOCX/TXT/XML file.
          example: https://arxiv.org/pdf/1706.03762.pdf
        user_context:
          type: string
          maxLength: 1000
          nullable: true
          description: |
            Optional user-supplied context message injected into the RAG pipeline
            as a system-level hint. Guides chunking strategy or retrieval focus.
            Not stored as paper metadata.
          example: Focus on the multi-head attention mechanism and positional encoding.

    UpdatePaperMetadataRequest:
      type: object
      description: |
        Partial metadata correction/override. Any user who has this paper in
        their library may update metadata. Corrections are applied globally to
        the paper record (shared resource — see Access Control note in info).
        At least one field required.
      minProperties: 1
      properties:
        title:
          type: string
          maxLength: 500
          example: "Attention Is All You Need (Corrected Title)"
        authors:
          type: array
          items:
            $ref: '#/components/schemas/Author'
        abstract:
          type: string
          maxLength: 5000
          example: Corrected abstract text.
        year:
          type: integer
          minimum: 1000
          maximum: 2100
          example: 2017
        journal:
          type: string
          maxLength: 300
          example: NeurIPS 2017
        venue:
          type: string
          maxLength: 300
          example: Advances in Neural Information Processing Systems

    # --------------------------------------------------------------------------
    # PIPELINE TRACE SCHEMA
    # --------------------------------------------------------------------------

    PipelineStep:
      type: object
      required:
        - step
        - status
      properties:
        step:
          type: string
          enum:
            - parse
            - chunk
            - embed
            - index
          example: embed
        status:
          type: string
          enum:
            - pending
            - running
            - done
            - failed
          example: done
        duration_ms:
          type: integer
          nullable: true
          description: Wall-clock duration of this step in milliseconds. Null
            if step has not completed.
          example: 2800
        extraction_method:
          type: string
          nullable: true
          enum:
            - native_text
            - ocr
          description: Present only on `parse` step.
          example: native_text
        chunk_count:
          type: integer
          nullable: true
          description: Number of chunks produced. Present only on `chunk` step.
          example: 142
        chunk_strategy:
          type: string
          nullable: true
          description: Chunking strategy applied. Present only on `chunk` step.
          example: hybrid
        model:
          type: string
          nullable: true
          description: Embedding model identifier. Present only on `embed` step.
          example: text-embedding-3-small
        vector_count:
          type: integer
          nullable: true
          description: Number of vectors written to the index. Present only on
            `embed` step.
          example: 142
        vector_store:
          type: string
          nullable: true
          description: Vector store used. Present only on `index` step.
          example: pgvector
        error:
          type: string
          nullable: true
          description: Step-level error message if status is `failed`.
          example: null

    PipelineTraceResponse:
      type: object
      description: |
        Per-paper RAG pipeline execution trace. Accessible to the paper's
        uploader and admin users. Used to diagnose pipeline failures and
        validate pipeline performance.
      required:
        - paper_id
        - pipeline_steps
        - total_duration_ms
        - triggered_at
      properties:
        paper_id:
          type: string
          format: uuid
          example: 01J9XK234PQRSTUVWXYZ
        pipeline_steps:
          type: array
          items:
            $ref: '#/components/schemas/PipelineStep'
        total_duration_ms:
          type: integer
          nullable: true
          description: Total wall-clock duration across all steps. Null if pipeline
            has not completed.
          example: 3355
        triggered_by:
          type: string
          format: uuid
          description: User ID who initiated the ingest that triggered this pipeline run.
          example: 01J9XK111UPLOADER
        triggered_at:
          type: string
          format: date-time
          example: "2025-03-10T14:00:00Z"
        completed_at:
          type: string
          format: date-time
          nullable: true
          example: "2025-03-10T14:00:03Z"

    # --------------------------------------------------------------------------
    # TAGS SCHEMAS
    # --------------------------------------------------------------------------

    TagsResponse:
      type: object
      required:
        - paper_id
        - tags
      properties:
        paper_id:
          type: string
          format: uuid
          example: 01J9XK234PQRSTUVWXYZ
        tags:
          type: array
          items:
            type: string
          description: All tags the requesting user has applied to this paper.
          example:
            - transformer
            - attention
            - nlp

    AddTagRequest:
      type: object
      required:
        - label
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 50
          description: |
            Tag label. Normalised to lowercase and trimmed server-side before
            storage. Duplicates on the same (user, paper) pair are silently
            ignored.
          example: transformer

    # --------------------------------------------------------------------------
    # CHAT SCHEMAS
    # --------------------------------------------------------------------------

    ChatMessage:
      type: object
      description: A single persisted message in the (user, paper) conversation.
      required:
        - message_id
        - role
        - content
        - created_at
      properties:
        message_id:
          type: string
          format: uuid
          example: 01J9XCHAT001MSGUUID
        role:
          type: string
          enum:
            - user
            - assistant
          example: assistant
        content:
          type: string
          description: Full message text. For assistant messages, this is the
            complete answer after streaming has concluded.
          example: The attention mechanism allows the model to weigh the relevance
            of different words when encoding a sequence...
        sources:
          type: array
          nullable: true
          description: Source chunks cited in this assistant response. Null for
            user messages and assistant messages still streaming.
          items:
            $ref: '#/components/schemas/SourceChunk'
        tokens_used:
          type: integer
          nullable: true
          description: Total tokens consumed by the LLM for this turn. Null for
            user messages.
          example: 840
        created_at:
          type: string
          format: date-time
          example: "2025-03-10T14:22:00Z"

    SourceChunk:
      type: object
      description: A source chunk from the RAG index cited in an assistant response.
      required:
        - chunk_text
        - confidence_score
      properties:
        chunk_text:
          type: string
          description: The verbatim text of the retrieved chunk.
          example: Multi-head attention allows the model to jointly attend to
            information from different representation subspaces...
        page_number:
          type: integer
          nullable: true
          description: Page number in the original document where this chunk originates.
          example: 4
        section:
          type: string
          nullable: true
          description: Section heading under which this chunk appears.
          example: Methodology
        confidence_score:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
          description: Cosine similarity score from the vector retrieval step.
            Indicates how closely this chunk matches the user's query.
          example: 0.91

    ChatHistoryResponse:
      type: object
      required:
        - paper_id
        - messages
        - pagination
      properties:
        paper_id:
          type: string
          format: uuid
          example: 01J9XK234PQRSTUVWXYZ
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
          description: Ordered list of messages, oldest first.
        session_cleared_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of the last conversation clear operation, if any.
            Messages returned are only those created after this timestamp.
          example: null
        pagination:
          $ref: '#/components/schemas/CursorPagination'

    # --------------------------------------------------------------------------
    # DISCOVERY SCHEMAS
    # --------------------------------------------------------------------------

    DiscoveryResult:
      type: object
      description: |
        A single paper result from the federated discovery search. Uniform shape
        regardless of whether the paper exists in the platform DB.
        `paper_id` is null when the paper is not yet in the platform.
        `rag_status` is `none` for papers not in the platform.
        `is_in_library` reflects the requesting user's library membership.
      required:
        - doi
        - title
        - rag_status
        - is_in_library
      properties:
        doi:
          type: string
          nullable: true
          description: DOI of the paper. Primary deduplication key. Null for
            papers from sources that do not assign DOIs.
          example: "10.48550/arXiv.1706.03762"
        paper_id:
          type: string
          format: uuid
          nullable: true
          description: Platform paper ID. Null if this paper has never been
            ingested or saved on this platform.
          example: 01J9XK234PQRSTUVWXYZ
        title:
          type: string
          example: "Attention Is All You Need"
        authors:
          type: array
          items:
            $ref: '#/components/schemas/Author'
        year:
          type: integer
          nullable: true
          example: 2017
        journal:
          type: string
          nullable: true
          example: Advances in Neural Information Processing Systems
        abstract:
          type: string
          nullable: true
          example: We propose a new simple network architecture, the Transformer...
        url:
          type: string
          format: uri
          nullable: true
          description: Link to the paper at the external source (arXiv, DOI resolver).
          example: https://arxiv.org/abs/1706.03762
        rag_status:
          $ref: '#/components/schemas/RagStatus'
        is_in_library:
          type: boolean
          description: Whether the requesting user has saved or ingested this paper.
          example: false
        external_source:
          type: string
          description: Which third-party API returned this result.
          enum:
            - openalex
            - semantic_scholar
            - unpaywall
          example: openalex

    DiscoverySearchResponse:
      type: object
      required:
        - results
        - pagination
        - query
      properties:
        query:
          type: object
          description: Echo of the effective query parameters applied server-side.
          properties:
            q:
              type: string
              nullable: true
              example: transformer attention mechanism
            author:
              type: string
              nullable: true
              example: Vaswani
            year_from:
              type: integer
              nullable: true
              example: 2017
            year_to:
              type: integer
              nullable: true
              example: 2023
            domain:
              type: string
              nullable: true
              example: machine learning
            journal:
              type: string
              nullable: true
              example: NeurIPS
            has_rag:
              type: boolean
              nullable: true
              example: false
        results:
          type: array
          items:
            $ref: '#/components/schemas/DiscoveryResult'
        pagination:
          $ref: '#/components/schemas/CursorPagination'

    # --------------------------------------------------------------------------
    # COLLECTION SCHEMAS
    # --------------------------------------------------------------------------

    Collection:
      type: object
      required:
        - collection_id
        - name
        - visibility
        - paper_count
        - created_at
        - updated_at
      properties:
        collection_id:
          type: string
          format: uuid
          example: 01J9XK999COLLECTIONS
        name:
          type: string
          maxLength: 200
          example: My Reading List
        description:
          type: string
          nullable: true
          maxLength: 1000
          example: Papers for my thesis on attention mechanisms.
        visibility:
          type: string
          enum:
            - private
          description: |
            Collection visibility. Currently only `private` is supported in v1.
            `public` with shareable link is reserved for v2.
          example: private
        paper_count:
          type: integer
          description: Number of papers currently in this collection.
          example: 12
        created_at:
          type: string
          format: date-time
          example: "2025-01-15T10:30:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2025-03-10T14:22:00Z"

    CreateCollectionRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: My Reading List
        description:
          type: string
          maxLength: 1000
          nullable: true
          example: Papers for my thesis on attention mechanisms.

    UpdateCollectionRequest:
      type: object
      description: Partial update. At least one field required.
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: Thesis Papers — Attention
        description:
          type: string
          maxLength: 1000
          nullable: true
          example: Updated description.

    CollectionPapersResponse:
      type: object
      required:
        - collection_id
        - papers
        - pagination
      properties:
        collection_id:
          type: string
          format: uuid
          example: 01J9XK999COLLECTIONS
        papers:
          type: array
          items:
            $ref: '#/components/schemas/PaperSummary'
        pagination:
          $ref: '#/components/schemas/CursorPagination'

    # --------------------------------------------------------------------------
    # NOTIFICATION SCHEMAS
    # --------------------------------------------------------------------------

    Notification:
      type: object
      required:
        - notification_id
        - type
        - title
        - body
        - read
        - created_at
      properties:
        notification_id:
          type: string
          format: uuid
          example: 01J9XNOTIF001UUID
        type:
          type: string
          enum:
            - rag_ready
            - rag_failed
            - system
          description: |
            - `rag_ready` — A RAG pipeline completed for a paper in the user's library.
            - `rag_failed` — A RAG pipeline failed for a paper in the user's library.
            - `system` — Platform-level announcement or maintenance notice.
          example: rag_ready
        title:
          type: string
          example: "RAG Ready: Attention Is All You Need"
        body:
          type: string
          example: The RAG index for your paper is ready. Start chatting now.
        paper_id:
          type: string
          format: uuid
          nullable: true
          description: Reference to the related paper. Null for system notifications.
          example: 01J9XK234PQRSTUVWXYZ
        read:
          type: boolean
          description: Whether the user has acknowledged this notification.
          example: false
        created_at:
          type: string
          format: date-time
          example: "2025-03-10T14:22:00Z"

    NotificationsListResponse:
      type: object
      required:
        - notifications
        - unread_count
        - pagination
      properties:
        notifications:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        unread_count:
          type: integer
          description: Total number of unread notifications for this user across all pages.
          example: 3
        pagination:
          $ref: '#/components/schemas/CursorPagination'

    # --------------------------------------------------------------------------
    # DASHBOARD SCHEMAS
    # --------------------------------------------------------------------------

    DashboardResponse:
      type: object
      required:
        - papers
        - pagination
        - scope
      properties:
        scope:
          type: string
          enum:
            - uploaded
            - saved
            - ingested
            - chatted
          description: Echo of the `scope` parameter applied to this response.
          example: ingested
        papers:
          type: array
          items:
            $ref: '#/components/schemas/PaperSummary'
        pagination:
          $ref: '#/components/schemas/CursorPagination'

    # --------------------------------------------------------------------------
    # ADMIN SCHEMAS
    # --------------------------------------------------------------------------

    AdminUserRecord:
      type: object
      description: Full user record as visible to admins. Includes fields not
        exposed to regular users.
      allOf:
        - $ref: '#/components/schemas/UserProfile'
        - type: object
          properties:
            paper_count:
              type: integer
              description: Total papers in this user's library.
              example: 47
            total_chats:
              type: integer
              description: Total chat messages sent by this user across all papers.
              example: 312
            last_active_at:
              type: string
              format: date-time
              nullable: true
              example: "2025-03-10T14:22:00Z"

    AdminUsersListResponse:
      type: object
      required:
        - users
        - pagination
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/AdminUserRecord'
        pagination:
          $ref: '#/components/schemas/CursorPagination'

    AdminPapersListResponse:
      type: object
      required:
        - papers
        - pagination
      properties:
        papers:
          type: array
          items:
            $ref: '#/components/schemas/PaperDetail'
        pagination:
          $ref: '#/components/schemas/CursorPagination'

    PlatformStats:
      type: object
      description: Platform-wide aggregate statistics. Cached server-side for
        5 minutes. Suitable for landing page display and admin dashboards.
      required:
        - total_users
        - total_papers
        - total_rags_ready
        - total_conversations
        - last_updated
      properties:
        total_users:
          type: integer
          example: 8241
        total_papers:
          type: integer
          example: 10432
        total_rags_ready:
          type: integer
          example: 3891
        total_conversations:
          type: integer
          example: 47201
        active_users_7d:
          type: integer
          description: Unique users who made at least one authenticated request in
            the last 7 days. Admin-only field — omitted from public /stats response.
          example: 1203
        avg_rag_build_time_ms:
          type: integer
          description: Rolling average RAG pipeline duration in milliseconds over
            the last 1000 pipeline runs. Admin-only field.
          example: 4820
        last_updated:
          type: string
          format: date-time
          description: Timestamp of the last cache refresh for this stats object.
          example: "2025-03-10T14:20:00Z"

    ArchitectureManifest:
      type: object
      description: |
        Static system architecture manifest. Represents the platform's component
        topology as a directed graph. Consumed by the admin frontend to render a
        visual architecture diagram. Version-controlled in the codebase and
        updated when the architecture changes.
      required:
        - version
        - nodes
        - edges
      properties:
        version:
          type: string
          description: Manifest version. Increment when nodes or edges change.
          example: "1.0.0"
        nodes:
          type: array
          items:
            type: object
            required:
              - id
              - label
              - type
            properties:
              id:
                type: string
                example: api
              label:
                type: string
                example: FastAPI Backend
              type:
                type: string
                enum:
                  - service
                  - database
                  - vector_store
                  - model
                  - queue
                  - cache
                  - external_api
                  - storage
                example: service
              description:
                type: string
                nullable: true
                example: Core REST + WebSocket API. Python/FastAPI.
              tech:
                type: string
                nullable: true
                description: Technology/version label for UI display.
                example: FastAPI 0.111 / Python 3.12
        edges:
          type: array
          items:
            type: object
            required:
              - from
              - to
              - label
            properties:
              from:
                type: string
                example: api
              to:
                type: string
                example: postgres
              label:
                type: string
                example: read/write (asyncpg)
              direction:
                type: string
                enum:
                  - unidirectional
                  - bidirectional
                default: unidirectional
                example: bidirectional

    # --------------------------------------------------------------------------
    # HEALTH SCHEMAS
    # --------------------------------------------------------------------------

    HealthLive:
      type: object
      description: Liveness check response. A 200 response means the process
        is alive and accepting connections. No dependency checks are performed.
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - alive
          example: alive
        timestamp:
          type: string
          format: date-time
          example: "2025-03-10T14:22:00Z"

    HealthReady:
      type: object
      description: |
        Readiness check response. Checks reachability of all critical and
        non-critical dependencies.
        - `ready` — All checks passed. Load balancer routes traffic normally.
        - `degraded` — One or more non-critical checks failed (e.g. scholar_api).
          Core functionality (upload, chat) is unaffected. Load balancer continues
          routing traffic.
        - `not_ready` — One or more critical checks failed (postgres, redis).
          Load balancer should stop routing traffic to this instance.
      required:
        - status
        - checks
      properties:
        status:
          type: string
          enum:
            - ready
            - degraded
            - not_ready
          example: ready
        checks:
          type: object
          required:
            - postgres
            - redis
            - vector_store
            - llm_api
            - scholar_api
          properties:
            postgres:
              type: string
              enum:
                - ok
                - error
              description: Critical. Failure → not_ready.
              example: ok
            redis:
              type: string
              enum:
                - ok
                - error
              description: Critical. Failure → not_ready.
              example: ok
            vector_store:
              type: string
              enum:
                - ok
                - error
              description: Critical. Failure → not_ready.
              example: ok
            llm_api:
              type: string
              enum:
                - ok
                - error
              description: Critical. Failure → not_ready.
              example: ok
            scholar_api:
              type: string
              enum:
                - ok
                - error
              description: Non-critical. Failure → degraded. Upload and chat
                are unaffected. Discovery search will return errors.
              example: ok
        timestamp:
          type: string
          format: date-time
          example: "2025-03-10T14:22:00Z"

  # ----------------------------------------------------------------------------
  # REUSABLE PARAMETERS
  # ----------------------------------------------------------------------------
  parameters:

    PaperIdPath:
      name: id
      in: path
      required: true
      description: Unique platform paper identifier (UUID v7).
      schema:
        type: string
        format: uuid
      example: 01J9XK234PQRSTUVWXYZ

    CollectionIdPath:
      name: id
      in: path
      required: true
      description: Unique collection identifier (UUID v7).
      schema:
        type: string
        format: uuid
      example: 01J9XK999COLLECTIONS

    NotificationIdPath:
      name: id
      in: path
      required: true
      description: Unique notification identifier (UUID v7).
      schema:
        type: string
        format: uuid
      example: 01J9XNOTIF001UUID

    UserIdPath:
      name: id
      in: path
      required: true
      description: Unique user identifier (UUID v7). Admin endpoints only.
      schema:
        type: string
        format: uuid
      example: 01J9XK111USERUUID

    CursorQuery:
      name: cursor
      in: query
      required: false
      description: |
        Pagination cursor from the previous response's `pagination.next_cursor`.
        Omit to fetch the first page.
      schema:
        type: string
      example: eyJpZCI6IjAxSjlYSzIzNFBRUlNUVVZXWFlaIiwic29ydF92YWx1ZSI6IjIwMjUtMDEtMTUifQ==

    LimitQuery:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return per page. Default 20, max 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20

  # ----------------------------------------------------------------------------
  # REUSABLE RESPONSES
  # ----------------------------------------------------------------------------
  responses:

    UnauthorizedError:
      description: |
        Missing, invalid, or expired access token.
        Call `POST /auth/refresh` to obtain a new access token.
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            MissingToken:
              summary: No token provided
              value:
                error:
                  code: UNAUTHORIZED
                  message: Authorization header missing or malformed.
                  request_id: req_01J9XK234PQRSTUVWXYZ
            ExpiredToken:
              summary: Access token expired
              value:
                error:
                  code: TOKEN_EXPIRED
                  message: Access token has expired. Refresh via POST /auth/refresh.
                  request_id: req_01J9XK234PQRSTUVWXYZ

    ForbiddenError:
      description: Authenticated but insufficient permissions for this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: FORBIDDEN
              message: You do not have permission to perform this action.
              request_id: req_01J9XK234PQRSTUVWXYZ

    NotFoundError:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: NOT_FOUND
              message: The requested resource does not exist.
              request_id: req_01J9XK234PQRSTUVWXYZ

    ValidationError:
      description: Request body or query parameter validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: VALIDATION_ERROR
              message: One or more fields failed validation.
              details:
                year_from: Must be a 4-digit integer between 1000 and 2100.
                file: Exceeds the 50 MB maximum file size limit.
              request_id: req_01J9XK234PQRSTUVWXYZ

    RateLimitError:
      description: |
        Rate limit exceeded. Inspect `Retry-After` header for seconds to wait
        before retrying.
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: RATE_LIMITED
              message: Rate limit exceeded. Please retry after 60 seconds.
              request_id: req_01J9XK234PQRSTUVWXYZ

    InternalError:
      description: Unhandled server-side error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INTERNAL_ERROR
              message: An unexpected error occurred. Please try again. If the
                problem persists, contact support with the request_id.
              request_id: req_01J9XK234PQRSTUVWXYZ

  # ----------------------------------------------------------------------------
  # REUSABLE HEADERS
  # ----------------------------------------------------------------------------
  headers:

    X-RateLimit-Limit:
      description: Maximum number of requests allowed in the current rate limit window.
      schema:
        type: integer
      example: 120

    X-RateLimit-Remaining:
      description: Number of requests remaining in the current rate limit window.
      schema:
        type: integer
      example: 94

    X-RateLimit-Reset:
      description: Unix timestamp (UTC) when the current rate limit window resets.
      schema:
        type: integer
      example: 1715420400

    Retry-After:
      description: Seconds to wait before retrying after a 429 rate limit response.
      schema:
        type: integer
      example: 60

# ==============================================================================
# PATHS
# ==============================================================================
paths:

  # ============================================================================
  # SYSTEM — Health & Public Stats
  # ============================================================================

  /health:
    get:
      operationId: health_liveness
      tags:
        - System
      summary: Liveness probe
      description: |
        Returns 200 if the server process is alive and accepting connections.
        No downstream dependency checks are performed. Used by load balancers
        and Kubernetes liveness probes.

        **Rate limit:** Exempt from standard rate limiting.
        **Auth:** None required.
      security: []
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthLive'
              example:
                status: alive
                timestamp: "2025-03-10T14:22:00Z"

  /health/ready:
    get:
      operationId: health_readiness
      tags:
        - System
      summary: Readiness probe
      description: |
        Checks reachability of all platform dependencies and returns a
        structured status. Used by Kubernetes readiness probes and load
        balancers to determine whether this instance should receive traffic.

        - Returns `200` for `ready` and `degraded` states.
        - Returns `503` for `not_ready`.

        **Rate limit:** Exempt from standard rate limiting.
        **Auth:** None required.
      security: []
      responses:
        '200':
          description: Platform is ready or degraded but operational.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReady'
              examples:
                Ready:
                  summary: All checks passed
                  value:
                    status: ready
                    checks:
                      postgres: ok
                      redis: ok
                      vector_store: ok
                      llm_api: ok
                      scholar_api: ok
                    timestamp: "2025-03-10T14:22:00Z"
                Degraded:
                  summary: Non-critical dependency down
                  value:
                    status: degraded
                    checks:
                      postgres: ok
                      redis: ok
                      vector_store: ok
                      llm_api: ok
                      scholar_api: error
                    timestamp: "2025-03-10T14:22:00Z"
        '503':
          description: Critical dependency unreachable. Instance should not
            receive traffic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReady'
              example:
                status: not_ready
                checks:
                  postgres: error
                  redis: ok
                  vector_store: ok
                  llm_api: ok
                  scholar_api: ok
                timestamp: "2025-03-10T14:22:00Z"

  /stats:
    get:
      operationId: get_public_stats
      tags:
        - System
      summary: Public platform statistics
      description: |
        Returns aggregate platform statistics suitable for landing page social
        proof display. Response is cached server-side for 5 minutes.
        Admin-only fields (`active_users_7d`, `avg_rag_build_time_ms`) are
        omitted from this unauthenticated response.

        **Rate limit:** 120 requests/minute.
        **Auth:** None required.
      security: []
      responses:
        '200':
          description: Cached platform statistics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformStats'
              example:
                total_users: 8241
                total_papers: 10432
                total_rags_ready: 3891
                total_conversations: 47201
                last_updated: "2025-03-10T14:20:00Z"
        '500':
          $ref: '#/components/responses/InternalError'

  # ============================================================================
  # AUTH
  # ============================================================================

  /auth/signup:
    post:
      operationId: auth_signup
      tags:
        - Auth
      summary: Register a new user account
      description: |
        Creates a new user account with email and password. On success, a
        verification email is dispatched to the provided address containing
        a time-limited token (24 hours). The account is created immediately
        but access to protected routes is blocked until email verification
        is completed.

        **Rate limit:** 10 requests per 15 minutes per IP.
        **Auth:** None required.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
            example:
              name: Dr. Aisha Patel
              email: aisha.patel@university.edu
              password: "S3cure!Pass#2025"
              institution: MIT CSAIL
      responses:
        '201':
          description: Account created successfully. Verification email sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupResponse'
              example:
                user_id: 01J9XK234PQRSTUVWXYZ
                email: aisha.patel@university.edu
                message: Account created. A verification email has been sent to
                  aisha.patel@university.edu. The link expires in 24 hours.
        '409':
          description: An account with this email address already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: DUPLICATE_EMAIL
                  message: An account with this email address already exists.
                  request_id: req_01J9XK234PQRSTUVWXYZ
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/verify-email:
    get:
      operationId: auth_verify_email
      tags:
        - Auth
      summary: Verify email address
      description: |
        Consumes a verification token dispatched via the signup email. On
        success, the user's `email_verified` flag is set to true and they gain
        full access to protected routes.

        The token is single-use and expires 24 hours after signup. A new
        verification email can be requested via `POST /auth/resend-verification`.

        **Rate limit:** 10 requests per 15 minutes per IP.
        **Auth:** None required.
      security: []
      parameters:
        - name: token
          in: query
          required: true
          description: Verification token from the signup email link.
          schema:
            type: string
          example: vtkn_01J9XK234PQRSTUVWXYZ_a1b2c3d4e5f6
      responses:
        '200':
          description: Email verified successfully. User may now log in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Email verified successfully. You may now log in.
        '400':
          description: Token is invalid, malformed, or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INVALID_VERIFICATION_TOKEN
                  message: This verification link is invalid or has expired.
                    Request a new link via POST /auth/resend-verification.
                  request_id: req_01J9XK234PQRSTUVWXYZ
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/resend-verification:
    post:
      operationId: auth_resend_verification
      tags:
        - Auth
      summary: Resend email verification link
      description: |
        Dispatches a new verification email to the address supplied. If the
        account is already verified, returns 200 with an informational message
        (no-op). If the account does not exist, returns 200 regardless to
        prevent email enumeration.

        **Rate limit:** 10 requests per 15 minutes per IP.
        **Auth:** None required.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: aisha.patel@university.edu
      responses:
        '200':
          description: |
            If an unverified account exists for this email, a new verification
            link has been sent. Response is identical regardless of whether the
            email exists (anti-enumeration).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: If an unverified account exists for this email, a new
                  verification link has been sent.
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/login:
    post:
      operationId: auth_login
      tags:
        - Auth
      summary: Authenticate with email and password
      description: |
        Authenticates the user with email and password credentials. On success,
        returns a short-lived JWT access token and sets an HttpOnly refresh
        token cookie.

        Unverified accounts receive a `403 EMAIL_NOT_VERIFIED` response.

        **Rate limit:** 10 requests per 15 minutes per IP (brute force protection).
        **Auth:** None required.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: aisha.patel@university.edu
              password: "S3cure!Pass#2025"
      responses:
        '200':
          description: Authentication successful.
          headers:
            Set-Cookie:
              description: |
                HttpOnly, Secure, SameSite=Strict refresh token cookie.
                `refresh_token=<token>; HttpOnly; Secure; SameSite=Strict;
                Path=/api/v1/auth; Max-Age=2592000`
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid email or password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INVALID_CREDENTIALS
                  message: Invalid email or password.
                  request_id: req_01J9XK234PQRSTUVWXYZ
        '403':
          description: Account exists but email has not been verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: EMAIL_NOT_VERIFIED
                  message: Please verify your email address before logging in.
                    Check your inbox or request a new link via POST
                    /auth/resend-verification.
                  request_id: req_01J9XK234PQRSTUVWXYZ
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/refresh:
    post:
      operationId: auth_refresh_token
      tags:
        - Auth
      summary: Rotate access and refresh tokens
      description: |
        Exchanges the current HttpOnly refresh token cookie for a new access
        token. The refresh token is simultaneously rotated — the old token is
        immediately invalidated and a new HttpOnly cookie is set.

        **Refresh token rotation** means a stolen refresh token can only be
        used once before it is invalidated. If the server detects a previously
        used refresh token being replayed, it invalidates the entire token
        family for this user (all sessions logged out) as a security measure.

        **Client implementation note:** On any 401 `TOKEN_EXPIRED` response
        from a protected endpoint, the client should automatically call this
        endpoint once, then retry the original request with the new access
        token. If this endpoint also returns 401, redirect to login.

        **Rate limit:** 10 requests per 15 minutes per IP.
        **Auth:** Refresh token cookie (automatically sent by browser).
      security:
        - RefreshTokenCookie: []
      responses:
        '200':
          description: Tokens rotated successfully.
          headers:
            Set-Cookie:
              description: New rotated refresh token cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
              example:
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                token_type: bearer
                expires_in: 900
        '401':
          description: Refresh token missing, invalid, expired, or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INVALID_REFRESH_TOKEN
                  message: Refresh token is invalid or has expired. Please log in again.
                  request_id: req_01J9XK234PQRSTUVWXYZ
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/forgot-password:
    post:
      operationId: auth_forgot_password
      tags:
        - Auth
      summary: Request a password reset link
      description: |
        Initiates the password reset flow. If an account with the supplied
        email exists, a reset link containing a single-use token is dispatched.
        The token expires in 1 hour.

        Response is identical regardless of whether the email exists
        (anti-enumeration).

        **Rate limit:** 10 requests per 15 minutes per IP.
        **Auth:** None required.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
            example:
              email: aisha.patel@university.edu
      responses:
        '200':
          description: |
            If an account with this email exists, a password reset link has been
            sent. Response is identical regardless (anti-enumeration).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: If an account with this email exists, a password reset
                  link valid for 1 hour has been sent.
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/reset-password:
    post:
      operationId: auth_reset_password
      tags:
        - Auth
      summary: Consume reset token and set new password
      description: |
        Completes the password reset flow. Consumes the single-use token from
        the reset email and sets a new password for the associated account. On
        success, all active refresh tokens for the user are invalidated (all
        sessions logged out). The user must log in again with the new password.

        **Rate limit:** 10 requests per 15 minutes per IP.
        **Auth:** None required.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
            example:
              token: prst_01J9XK234PQRSTUVWXYZ_a1b2c3d4
              new_password: "NewS3cure!Pass#2025"
      responses:
        '200':
          description: Password reset successfully. All sessions invalidated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Password reset successfully. All active sessions have
                  been logged out. Please log in with your new password.
        '400':
          description: Token is invalid, malformed, expired, or already used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INVALID_RESET_TOKEN
                  message: This password reset link is invalid, has expired, or
                    has already been used. Request a new link.
                  request_id: req_01J9XK234PQRSTUVWXYZ
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/logout:
    post:
      operationId: auth_logout
      tags:
        - Auth
      summary: Logout current session
      description: |
        Invalidates the current device's refresh token. The access token
        remains technically valid until it expires naturally (≤15 minutes) but
        the refresh token cookie is cleared, preventing silent renewal.

        To invalidate all active sessions across all devices, use
        `POST /auth/logout-all`.

        **Rate limit:** 120 requests/minute.
        **Auth:** Bearer token required.
      responses:
        '200':
          description: Current session logged out successfully.
          headers:
            Set-Cookie:
              description: Clears the refresh token cookie.
              schema:
                type: string
                example: "refresh_token=; HttpOnly; Secure; SameSite=Strict;
                  Path=/api/v1/auth; Max-Age=0"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Logged out successfully.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/logout-all:
    post:
      operationId: auth_logout_all
      tags:
        - Auth
      summary: Logout all sessions across all devices
      description: |
        Invalidates all refresh tokens associated with the authenticated user's
        account, effectively logging out every active session across all devices.
        Use this when a user suspects their account has been compromised.

        The current access token remains valid until natural expiry (≤15 minutes).

        **Rate limit:** 120 requests/minute.
        **Auth:** Bearer token required.
      responses:
        '200':
          description: All sessions invalidated.
          headers:
            Set-Cookie:
              description: Clears the refresh token cookie on the current device.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: All active sessions have been logged out across all devices.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalError'

  # ============================================================================
  # USERS — Profile
  # ============================================================================

  /users/me:
    get:
      operationId: get_current_user
      tags:
        - Users
      summary: Get authenticated user profile
      description: |
        Returns the full profile of the currently authenticated user.

        **Rate limit:** 120 requests/minute.
        **Auth:** Bearer token required.
      responses:
        '200':
          description: User profile retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalError'

    patch:
      operationId: update_current_user
      tags:
        - Users
      summary: Update authenticated user profile
      description: |
        Partially updates the authenticated user's profile. Only fields included
        in the request body are modified. At least one field must be provided.

        **Rate limit:** 120 requests/minute.
        **Auth:** Bearer token required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
            example:
              name: Dr. Aisha M. Patel
              institution: Stanford HAI
      responses:
        '200':
          description: Profile updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/me/password:
    patch:
      operationId: change_password
      tags:
        - Users
      summary: Change password (authenticated)
      description: |
        Changes the authenticated user's password. Requires the current password
        for verification. On success, all refresh tokens for the user are
        invalidated (all sessions logged out). The user must log in again with
        the new password.

        **Rate limit:** 10 requests per 15 minutes.
        **Auth:** Bearer token required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            example:
              current_password: "S3cure!Pass#2025"
              new_password: "NewS3cure!Pass#2025"
      responses:
        '200':
          description: Password changed. All sessions logged out.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Password changed successfully. All active sessions have
                  been logged out. Please log in with your new password.
        '400':
          description: Current password is incorrect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INCORRECT_PASSWORD
                  message: The current password provided is incorrect.
                  request_id: req_01J9XK234PQRSTUVWXYZ
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalError'

  # ============================================================================
  # PAPERS
  # ============================================================================

  /papers/upload:
    post:
      operationId: upload_paper
      tags:
        - Papers
      summary: Upload a research paper file
      description: |
        Uploads a research paper file directly from the client. Accepted formats:
        PDF, DOCX, TXT, XML. Maximum file size: 50 MB.

        **Deduplication:** The uploaded file is SHA-256 hashed server-side. If a
        paper with an identical hash already exists in the platform:
        - If `rag_status` is `ready` → the existing paper record is returned
          immediately, no pipeline triggered.
        - If `rag_status` is `processing` → the user is subscribed to the
          in-progress job via WebSocket `rag_status` push events.
        - If `rag_status` is `none` or `failed` → pipeline is triggered.

        The paper is automatically added to the uploading user's library
        (saved_papers) with `status: ingested`.

        Metadata extraction (title, authors, abstract, DOI, year, journal) is
        attempted asynchronously during the parse step. Fields that cannot be
        extracted are null and can be corrected via `PATCH /papers/{id}/metadata`.

        The `user_context` field is injected into the RAG pipeline as a
        system-level hint and is not stored as paper metadata.

        **Rate limit:** 20 requests per hour.
        **Auth:** Bearer token required.

        > **v1.1 note:** Resumable chunked upload for files approaching 50 MB
        > is reserved for v1.1. This endpoint supports single-shot upload only.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: |
                    Research paper file. Accepted MIME types:
                    `application/pdf`, `application/vnd.openxmlformats-officedocument
                    .wordprocessingml.document`, `text/plain`, `application/xml`,
                    `text/xml`. Maximum 50 MB.
                user_context:
                  type: string
                  maxLength: 1000
                  description: |
                    Optional context message injected into the RAG pipeline as a
                    system-level hint. Guides chunking strategy or retrieval focus.
                    Not stored as paper metadata.
                  example: Focus on the multi-head attention mechanism in Section 3.
      responses:
        '202':
          description: |
            Paper accepted. RAG pipeline queued asynchronously.
            Poll `GET /papers/{id}/status` or subscribe via WebSocket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadPaperResponse'
              examples:
                NewPaper:
                  summary: New paper, pipeline queued
                  value:
                    paper_id: 01J9XK234PQRSTUVWXYZ
                    rag_status: processing
                    deduplicated: false
                    message: Paper received. RAG pipeline queued. Subscribe via
                      WebSocket or poll GET /papers/01J9XK234PQRSTUVWXYZ/status.
                Deduplicated:
                  summary: Duplicate detected, RAG already ready
                  value:
                    paper_id: 01J9XK234PQRSTUVWXYZ
                    rag_status: ready
                    deduplicated: true
                    message: This paper already exists on the platform. RAG is
                      ready. Start chatting now.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '413':
          description: Uploaded file exceeds the 50 MB size limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: FILE_TOO_LARGE
                  message: The uploaded file exceeds the 50 MB maximum size limit.
                  details:
                    max_size_bytes: 52428800
                  request_id: req_01J9XK234PQRSTUVWXYZ
        '415':
          description: File format not supported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: UNSUPPORTED_FORMAT
                  message: Unsupported file format. Accepted formats are PDF,
                    DOCX, TXT, and XML.
                  request_id: req_01J9XK234PQRSTUVWXYZ
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalError'

  /papers/ingest:
    post:
      operationId: ingest_paper_doi_url
      tags:
        - Papers
      summary: Ingest a paper from DOI or URL
      description: |
        Ingests a research paper into the platform by DOI or direct URL. The
        backend resolves the full text, fetches the file, and triggers the
        RAG pipeline asynchronously.

        **DOI resolution:** Backend queries Unpaywall and OpenAlex to locate an
        open-access full-text PDF for the supplied DOI. If no open-access
        version is found, `file_url` on the resulting paper will remain null
        and `rag_status` will remain `none`. Metadata is still stored.

        **Deduplication:** For DOI-based ingestion, deduplication is performed
        against the `doi` field. For URL-based ingestion, the file is fetched
        and SHA-256 hashed before deduplication. Existing paper behaviour is
        identical to the upload endpoint.

        The paper is added to the requesting user's library with
        `status: ingested`.

        **Rate limit:** 20 requests per hour.
        **Auth:** Bearer token required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestPaperRequest'
            examples:
              DOIIngest:
                summary: Ingest by DOI
                value:
                  source: doi
                  doi: "10.48550/arXiv.1706.03762"
                  user_context: Focus on positional encoding section.
              URLIngest:
                summary: Ingest by direct URL
                value:
                  source: url
                  url: https://arxiv.org/pdf/1706.03762.pdf
      responses:
        '202':
          description: Ingest request accepted. Pipeline queued asynchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadPaperResponse'
        '400':
          description: |
            DOI could not be resolved, or the URL is unreachable/not a supported
            file format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                DOINotFound:
                  value:
                    error:
                      code: DOI_RESOLUTION_FAILED
                      message: Could not resolve a full-text file for this DOI.
                        Metadata has been saved. You may try again later or
                        upload the file directly.
                      request_id: req_01J9XK234PQRSTUVWXYZ
                URLUnreachable:
                  value:
                    error:
                      code: URL_FETCH_FAILED
                      message: The provided URL could not be fetched. Ensure the
                        URL is publicly accessible and points to a valid file.
                      request_id: req_01J9XK234PQRSTUVWXYZ
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          description: Paper already exists and is in the user's library.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: DUPLICATE_PAPER
                  message: This paper is already in your library.
                  details:
                    paper_id: 01J9XK234PQRSTUVWXYZ
                    rag_status: ready
                  request_id: req_01J9XK234PQRSTUVWXYZ
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalError'

  /papers/{id}:
    get:
      operationId: get_paper
      tags:
        - Papers
      summary: Get full paper detail
      description: |
        Returns the complete paper record including metadata, library membership
        details, user tags, collection membership, chat message count, and
        (when RAG is ready) a preview of the first 3 source chunks.

        The `file_url` field contains a pre-signed storage URL valid for 15
        minutes. Refresh by calling this endpoint again.

        The requesting user must have this paper in their library (saved or
        ingested). Admin users may access any paper.

        **Rate limit:** 120 requests/minute.
        **Auth:** Bearer token required.
      parameters:
        - $ref: '#/components/parameters/PaperIdPath'
      responses:
        '200':
          description: Paper detail retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaperDetail'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      operationId: remove_paper_from_library
      tags:
        - Papers
      summary: Remove paper from user's library
      description: |
        Removes this paper from the authenticated user's personal library
        (deletes their `saved_papers` record). Does **not** delete the global
        paper record or its RAG index — other users' access is unaffected.

        Hard deletion of the global paper record is an admin-only operation
        available at `DELETE /admin/papers/{id}`.

        **Rate limit:** 120 requests/minute.
        **Auth:** Bearer token required.
      parameters:
        - $ref: '#/components/parameters/PaperIdPath'
      responses:
        '200':
          description: Paper removed from library successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Paper removed from your library. The global paper record
                  and RAG index are unaffected.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Paper not found in this user's library.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: NOT_FOUND
                  message: This paper is not in your library.
                  request_id: req_01J9XK234PQRSTUVWXYZ
        '500':
          $ref: '#/components/responses/InternalError'

  /papers/{id}/metadata:
    patch:
      operationId: update_paper_metadata
      tags:
        - Papers
      summary: Update paper metadata
      description: |
        Partially updates the global paper record's metadata. Intended to correct
        or supplement auto-extracted metadata that is null or inaccurate.

        **Access:** Any user who has this paper in their library may update
        metadata. Updates apply globally to the shared paper record.

        At least one field must be provided.

        **Rate limit:** 120 requests/minute.
        **Auth:** Bearer token required.
      parameters:
        - $ref: '#/components/parameters/PaperIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePaperMetadataRequest'
            example:
              title: "Attention Is All You Need"
              year: 2017
              journal: Advances in Neural Information Processing Systems
      responses:
        '200':
          description: Metadata updated successfully. Returns full updated paper detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaperDetail'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /papers/{id}/status:
    get:
      operationId: get_paper_rag_status
      tags:
        - Papers
      summary: Poll RAG pipeline status
      description: |
        Returns the current RAG pipeline status and progress percentage for the
        specified paper. Used by the frontend to drive honest progress UI without
        fabricating pipeline steps.

        For real-time updates, subscribe via the WebSocket `rag_status` push
        event (preferred over polling when the WS connection is open).

        **Rate limit:** 120 requests/minute.
        **Auth:** Bearer token required.
      parameters:
        - $ref: '#/components/parameters/PaperIdPath'
      responses:
        '200':
          description: Pipeline status retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaperStatusResponse'
              examples:
                Processing:
                  value:
                    paper_id: 01J9XK234PQRSTUVWXYZ
                    rag_status: processing
                    progress: 65
                    current_step: embed
                    error_message: null
                Ready:
                  value:
                    paper_id: 01J9XK234PQRSTUVWXYZ
                    rag_status: ready
                    progress: 100
                    current_step: null
                    error_message: null
                Failed:
                  value:
                    paper_id: 01J9XK234PQRSTUVWXYZ
                    rag_status: failed
                    progress: 40
                    current_step: null
                    error_message: Embedding API returned a non-retryable error.
                      Check pipeline trace for details.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'

  /papers/{id}/save:
    post:
      operationId: save_paper_to_library
      tags:
        - Papers
      summary: Bookmark a paper (save without ingesting)
      description: |
        Adds a paper to the authenticated user's library with `status: bookmarked`.
        No RAG pipeline is triggered. The paper's file is not fetched.

        Primarily called from the discovery search results when the user selects
        "Save for later". The paper global record must already exist in the
        platform DB (i.e., `paper_id` is non-null in the discovery result).

        If the paper is already in the user's library (any status), returns 200
        with the current state (idempotent).

        To ingest and build RAG immediately, use `POST /papers/ingest` or
        `POST /papers/{id}/ingest`.

        **Rate limit:** 120 requests/minute.
        **Auth:** Bearer token required.
      parameters:
        - $ref: '#/components/parameters/PaperIdPath'
      responses:
        '200':
          description: Paper saved to library as a bookmark.
          content:
            application/json:
              schema:
                type: object
                properties:
                  paper_id:
                    type: string
                    format: uuid
                    example: 01J9XK234PQRSTUVWXYZ
                  library_status:
                    type: string
                    enum:
                      - bookmarked
                      - ingested
                    example: bookmarked
                  message:
                    type: string
                    example: Paper saved to your library.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'

  /papers/{id}/ingest:
    post:
      operationId: ingest_existing_paper
      tags:
        - Papers
      summary: Trigger RAG ingestion for an existing platform paper
      description: |
        Triggers the RAG pipeline for a paper that already has a record in the
        platform DB (e.g., a previously bookmarked paper or a paper found via
        discovery that another user has already saved). Updates the user's
        library entry to `status: ingested`.

        Uses the same deduplication and pipeline logic as `POST /papers/ingest`.
        If the paper's `rag_status` is already `ready`, the pipeline is not
        re-triggered and the existing RAG is returned.

        **Rate limit:** 20 requests per hour.
        **Auth:** Bearer token required.
      parameters:
        - $ref: '#/components/parameters/PaperIdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                user_context:
                  type: string
                  maxLength: 1000
                  nullable: true
                  description: Optional pipeline hint. Injected at the parse step.
                  example: Focus on the experimental results section.
      responses:
        '202':
          description: Ingestion triggered or existing RAG returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadPaperResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: RAG already ready — no action taken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadPaperResponse'
              example:
                paper_id: 01J9XK234PQRSTUVWXYZ
                rag_status: ready
                deduplicated: true
                message: RAG is already ready for this paper. Start chatting now.
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalError'

  /papers/{id}/pipeline-trace:
    get:
      operationId: get_pipeline_trace
      tags:
        - Papers
      summary: Get RAG pipeline execution trace
      description: |
        Returns the step-by-step execution trace of the RAG pipeline for this
        paper, including per-step duration, chunk count, embedding model used,
        and vector store details.

        **Access:** Available to the user who first uploaded/ingested this paper
        (`uploaded_by`) and to admin users. Other library members receive 403.

        Use this endpoint to diagnose poor RAG quality ("why is the RAG bad
        for this paper?") by examining extraction method, chunk count, and
        embedding model. Check step-level `error` fields for failed pipelines.

        **Rate limit:** 120 requests/minute.
        **Auth:** Bearer token required.
      parameters:
        - $ref: '#/components/parameters/PaperIdPath'
      responses:
        '200':
          description: Pipeline trace retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineTraceResponse'
              example:
                paper_id: 01J9XK234PQRSTUVWXYZ
                pipeline_steps:
                  - step: parse
                    status: done
                    duration_ms: 340
                    extraction_method: native_text
                  - step: chunk
                    status: done
                    duration_ms: 120
                    chunk_count: 142
                    chunk_strategy: hybrid
                  - step: embed
                    status: done
                    duration_ms: 2800
                    model: text-embedding-3-small
                    vector_count: 142
                  - step: index
                    status: done
                    duration_ms: 95
                    vector_store: pgvector
                total_duration_ms: 3355
                triggered_by: 01J9XK111UPLOADER
                triggered_at: "2025-03-10T14:00:00Z"
                completed_at: "2025-03-10T14:00:03Z"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'

  # ============================================================================
  # PAPERS — Tags
  # ============================================================================

  /papers/{id}/tags:
    get:
      operationId: list_paper_tags
      tags:
        - Papers
      summary: List user's tags on a paper
      description: |
        Returns all tags the authenticated user has applied to this paper.
        Tags are personal — other users' tags are not returned.

        **Rate limit:** 120 requests/minute.
        **Auth:** Bearer token required.
      parameters:
        - $ref: '#/components/parameters/PaperIdPath'
      responses:
        '200':
          description: Tags retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      operationId: add_paper_tag
      tags:
        - Papers
      summary: Add a tag to a paper
      description: |
        Adds a user-defined tag to this paper in the authenticated user's library.
        Tag labels are normalised to lowercase and trimmed server-side before
        storage. Adding a duplicate tag (same label on the same paper for the
        same user) is silently ignored (idempotent).

        Tags enable filtering via the `?tag=` parameter on `GET /dashboard/papers`.

        **Rate limit:** 120 requests/minute.
        **Auth:** Bearer token required.
      parameters:
        - $ref: '#/components/parameters/PaperIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddTagRequest'
            example:
              label: transformer
      responses:
        '201':
          description: Tag added successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /papers/{id}/tags/{tag}:
    delete:
      operationId: remove_paper_tag
      tags:
        - Papers
      summary: Remove a tag from a paper
      description: |
        Removes a specific tag from this paper in the authenticated user's library.
        Only affects the requesting user's tags. Idempotent — removing a tag that
        does not exist returns 200.

        **Rate limit:** 120 requests/minute.
        **Auth:** Bearer token required.
      parameters:
        - $ref: '#/components/parameters/PaperIdPath'
        - name: tag
          in: path
          required: true
          description: Tag label to remove (URL-encoded if contains special characters).
          schema:
            type: string
          example: transformer
      responses:
        '200':
          description: Tag removed (or did not exist — idempotent).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'

  # ============================================================================
  # CHAT (REST — History)
  # ============================================================================

  /papers/{id}/chat/history:
    get:
      operationId: get_chat_history
      tags:
        - Chat
      summary: Get persisted chat history for a paper
      description: |
        Returns the paginated conversation history for the authenticated user's
        rolling session with this paper. Messages are ordered oldest-first.

        This endpoint loads the conversation when a user reopens a paper they
        have previously chatted with. The WebSocket channel (`WS /ws`) handles
        active message exchange and real-time streaming.

        The session is a single rolling conversation per (user_id, paper_id) pair.
        Calling `DELETE /papers/{id}/chat/history` clears the conversation.

        **Rate limit:** 120 requests/minute.
        **Auth:** Bearer token required.
      parameters:
        - $ref: '#/components/parameters/PaperIdPath'
        - $ref: '#/components/parameters/CursorQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Chat history retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatHistoryResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: RAG is not ready for this paper. Chat is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: RAG_NOT_READY
                  message: The RAG index for this paper is not ready. Chat will
                    become available once the pipeline completes.
                  details:
                    rag_status: processing
                    progress: 45
                  request_id: req_01J9XK234PQRSTUVWXYZ
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      operationId: clear_chat_history
      tags:
        - Chat
      summary: Clear conversation history for a paper
      description: |
        Soft-deletes all chat messages in the user's rolling session with this
        paper and resets the rolling summary. The session record persists with
        a `cleared_at` timestamp for audit purposes. A fresh conversation starts
        on the next message.

        This action is irreversible from the user's perspective. Messages are
        not hard-deleted immediately (retained for 30 days for platform audit
        before physical deletion).

        **Rate limit:** 120 requests/minute.
        **Auth:** Bearer token required.
      parameters:
        - $ref: '#/components/parameters/PaperIdPath'
      responses:
        '200':
          description: Conversation cleared. Session reset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Conversation history cleared. Your next message will
                  start a fresh session.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'

  # ============================================================================
  # DISCOVERY
  # ============================================================================

  /discovery/search:
    get:
      operationId: discovery_search
      tags:
        - Discovery
      summary: Federated academic paper search
      description: |
        Searches across third-party academic APIs (OpenAlex, Semantic Scholar,
        Unpaywall) and returns a unified, deduplicated result list. Each result
        is annotated with platform metadata:
        - `paper_id` — non-null if the paper exists in the platform DB.
        - `rag_status` — current pipeline status on this platform.
        - `is_in_library` — whether the requesting user has saved/ingested this paper.

        The `has_rag=true` filter returns only papers whose DOI exists in the
        platform DB with `rag_status: ready`. Applied locally after external
        results are fetched.

        At least one of `q`, `author`, or `doi` must be provided.

        **Rate limit:** 30 requests/minute.
        **Auth:** Bearer token required.
      parameters:
        - name: q
          in: query
          required: false
          description: Keyword or full-text search query.
          schema:
            type: string
            maxLength: 500
          example: transformer attention mechanism
        - name: author
          in: query
          required: false
          description: Filter by author name (partial match supported).
          schema:
            type: string
            maxLength: 200
          example: Vaswani
        - name: doi
          in: query
          required: false
          description: Look up a specific paper by exact DOI.
          schema:
            type: string
          example: "10.48550/arXiv.1706.03762"
        - name: year_from
          in: query
          required: false
          description: Filter to papers published in or after this year (inclusive).
          schema:
            type: integer
            minimum: 1000
            maximum: 2100
          example: 2017
        - name: year_to
          in: query
          required: false
          description: Filter to papers published in or before this year (inclusive).
          schema:
            type: integer
            minimum: 1000
            maximum: 2100
          example: 2023
        - name: domain
          in: query
          required: false
          description: Topic or domain filter (e.g. "machine learning", "genomics").
          schema:
            type: string
            maxLength: 100
          example: machine learning
        - name: journal
          in: query
          required: false
          description: Filter by journal or conference venue name.
          schema:
            type: string
            maxLength: 200
          example: NeurIPS
        - name: has_rag
          in: query
          required: false
          description: |
            When true, filters results to only papers with `rag_status: ready`
            on this platform. Applied as a local post-filter after external
            results are fetched.
          schema:
            type: boolean
          example: false
        - $ref: '#/components/parameters/CursorQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Search results returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoverySearchResponse'
        '400':
          description: At least one of q, author, or doi must be provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: At least one of q, author, or doi must be provided.
                  request_id: req_01J9XK234PQRSTUVWXYZ
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '503':
          description: All configured third-party academic APIs are currently
            unreachable. Retry after the `Retry-After` interval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: SERVICE_UNAVAILABLE
                  message: Academic search APIs are temporarily unavailable.
                    Please try again shortly.
                  request_id: req_01J9XK234PQRSTUVWXYZ
        '500':
          $ref: '#/components/responses/InternalError'

  # ============================================================================
  # DASHBOARD
  # ============================================================================

  /dashboard/papers:
    get:
      operationId: get_dashboard_papers
      tags:
        - Dashboard
      summary: Get user's paper library (unified dashboard feed)
      description: |
        Returns the authenticated user's paper library as a paginated,
        filterable, sortable feed. All scope modes query the same underlying
        join of `papers` + `saved_papers` + `chat_sessions` scoped to the
        requesting user.

        ### Scope Parameter
        | Value | Description |
        |---|---|
        | `uploaded` | Papers this user first introduced to the platform |
        | `saved` | Bookmarked papers (status: bookmarked) |
        | `ingested` | Papers with active RAG (status: ingested) |
        | `chatted` | Papers this user has sent at least one message in |

        ### Sort Fields
        | Key | Description |
        |---|---|
        | `saved_at` | Date added to library (default, descending) |
        | `title` | Alphabetical |
        | `year` | Publication year |
        | `rag_status` | Groups ready RAGs first |
        | `last_chatted_at` | Most recently chatted |
        | `chat_count` | Most messages in conversation |

        ### Search
        The `q` parameter searches across title, authors, and abstract within
        the user's library only. Not a discovery search.

        **Rate limit:** 120 requests/minute.
        **Auth:** Bearer token required.
      parameters:
        - name: scope
          in: query
          required: false
          description: Library scope filter. Omit to return all library papers.
          schema:
            type: string
            enum:
              - uploaded
              - saved
              - ingested
              - chatted
          example: ingested
        - name: sort
          in: query
          required: false
          description: Field to sort results by.
          schema:
            type: string
            enum:
              - saved_at
              - title
              - year
              - rag_status
              - last_chatted_at
              - chat_count
            default: saved_at
          example: saved_at
        - name: order
          in: query
          required: false
          description: Sort direction.
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
          example: desc
        - name: q
          in: query
          required: false
          description: Full-text search within the user's library (title, authors,
            abstract).
          schema:
            type: string
            maxLength: 500
          example: attention mechanism
        - name: tag
          in: query
          required: false
          description: Filter by a specific user-defined tag label.
          schema:
            type: string
            maxLength: 50
          example: transformer
        - name: collection_id
          in: query
          required: false
          description: Filter to papers within a specific collection.
          schema:
            type: string
            format: uuid
          example: 01J9XK999COLLECTIONS
        - name: rag_status
          in: query
          required: false
          description: Filter by RAG pipeline status.
          schema:
            type: string
            enum:
              - none
              - processing
              - ready
              - failed
          example: ready
        - $ref: '#/components/parameters/CursorQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Dashboard papers retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  # ============================================================================
  # COLLECTIONS
  # ============================================================================

  /collections:
    get:
      operationId: list_collections
      tags:
        - Collections
      summary: List user's collections
      description: |
        Returns all collections created by the authenticated user, ordered by
        `updated_at` descending.

        **Rate limit:** 120 requests/minute.
        **Auth:** Bearer token required.
      parameters:
        - $ref: '#/components/parameters/CursorQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Collections retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                  - collections
                  - pagination
                properties:
                  collections:
                    type: array
                    items:
                      $ref: '#/components/schemas/Collection'
                  pagination:
                    $ref: '#/components/schemas/CursorPagination'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      operationId: create_collection
      tags:
        - Collections
      summary: Create a new collection
      description: |
        Creates a new personal paper collection (folder) for the authenticated
        user. Collections are private by default (v1). Public shareable
        collections are reserved for v2.

        **Rate limit:** 120 requests/minute.
        **Auth:** Bearer token required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCollectionRequest'
            example:
              name: Thesis Papers — Attention
              description: Core papers for my PhD thesis chapter on attention mechanisms.
      responses:
        '201':
          description: Collection created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /collections/{id}:
    get:
      operationId: get_collection
      tags:
        - Collections
      summary: Get a collection
      description: |
        Returns collection metadata (name, description, paper count). Use
        `GET /collections/{id}/papers` to retrieve the paginated paper list.

        **Rate limit:** 120 requests/minute.
        **Auth:** Bearer token required.
      parameters:
        - $ref: '#/components/parameters/CollectionIdPath'
      responses:
        '200':
          description: Collection retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'

    patch:
      operationId: update_collection
      tags:
        - Collections
      summary: Update a collection
      description: |
        Partially updates a collection's name or description. At least one field
        must be provided. Updates `updated_at` automatically.

        **Rate limit:** 120 requests/minute.
        **Auth:** Bearer token required.
      parameters:
        - $ref: '#/components/parameters/CollectionIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCollectionRequest'
            example:
              name: Thesis Papers — Transformers
      responses:
        '200':
          description: Collection updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      operationId: delete_collection
      tags:
        - Collections
      summary: Delete a collection
      description: |
        Deletes the collection and all its paper membership records. Papers
        themselves are not removed from the user's library or from the platform.

        **Rate limit:** 120 requests/minute.
        **Auth:** Bearer token required.
      parameters:
        - $ref: '#/components/parameters/CollectionIdPath'
      responses:
        '200':
          description: Collection deleted. Papers remain in library.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Collection deleted. Your papers remain in your library.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'

  /collections/{id}/papers:
    get:
      operationId: list_collection_papers
      tags:
        - Collections
      summary: List papers in a collection
      description: |
        Returns paginated papers within the specified collection, using the
        standard PaperSummary shape. Supports the same sort/order parameters
        as `GET /dashboard/papers`.

        **Rate limit:** 120 requests/minute.
        **Auth:** Bearer token required.
      parameters:
        - $ref: '#/components/parameters/CollectionIdPath'
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - saved_at
              - title
              - year
              - rag_status
            default: saved_at
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
        - $ref: '#/components/parameters/CursorQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Collection papers retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionPapersResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      operationId: add_paper_to_collection
      tags:
        - Collections
      summary: Add a paper to a collection
      description: |
        Adds a paper from the user's library to the specified collection.
        The paper must already be in the user's library. Adding a paper that
        is already in the collection is idempotent (returns 200, no error).

        **Rate limit:** 120 requests/minute.
        **Auth:** Bearer token required.
      parameters:
        - $ref: '#/components/parameters/CollectionIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - paper_id
              properties:
                paper_id:
                  type: string
                  format: uuid
                  example: 01J9XK234PQRSTUVWXYZ
      responses:
        '200':
          description: Paper added to collection (or already present — idempotent).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Paper added to collection.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Paper is not in this user's library or collection belongs
            to a different user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /collections/{id}/papers/{paper_id}:
    delete:
      operationId: remove_paper_from_collection
      tags:
        - Collections
      summary: Remove a paper from a collection
      description: |
        Removes a paper from the specified collection. The paper    
        remains in the user's library. Idempotent — removing a paper that
        is not in the collection returns 200.

        Rate limit: 120 requests/minute.
        Auth: Bearer token required.

      parameters:
        - $ref: '#/components/parameters/CollectionIdPath'
        - name: paper_id
          in: path
          required: true
          description: UUID of the paper to remove from the collection.
          schema:
            type: string
            format: uuid
          example: 01J9XK234PQRSTUVWXYZ
      responses:
        '200':
          description: Paper removed from collection. Remains in library.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Paper removed from collection. It remains in your library.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'


  # ============================================================================
  # NOTIFICATIONS
  # ============================================================================

  /notifications:
    get:
      operationId: list_notifications
      tags:
        - Notifications
      summary: List user notifications
      description: |
        Returns the authenticated user's paginated notification feed, ordered
        by `created_at` descending (newest first). Includes both read and unread
        notifications unless filtered.

        Notifications are delivered in real time via the multiplexed WebSocket
        connection when the user is online. This endpoint serves as the fallback
        for loading notifications on session start and for users who were offline
        when the notification was generated.

        The `unread_count` field in the response reflects the total unread count
        across all pages, not just the current page — use it to drive the bell
        badge in the UI.

        **Rate limit:** 120 requests/minute.
        **Auth:** Bearer token required.
      parameters:
        - name: unread_only
          in: query
          required: false
          description: When true, returns only unread notifications.
          schema:
            type: boolean
            default: false
          example: false
        - name: type
          in: query
          required: false
          description: Filter by notification type.
          schema:
            type: string
            enum:
              - rag_ready
              - rag_failed
              - system
          example: rag_ready
        - $ref: '#/components/parameters/CursorQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Notifications retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationsListResponse'
              example:
                notifications:
                  - notification_id: 01J9XNOTIF001UUID
                    type: rag_ready
                    title: "RAG Ready: Attention Is All You Need"
                    body: The RAG index for your paper is ready. Start chatting now.
                    paper_id: 01J9XK234PQRSTUVWXYZ
                    read: false
                    created_at: "2025-03-10T14:22:00Z"
                unread_count: 3
                pagination:
                  next_cursor: eyJpZCI6IjAxSjlYTk9USUY...
                  has_more: true
                  limit: 20
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalError'

  /notifications/read-all:
    patch:
      operationId: mark_all_notifications_read
      tags:
        - Notifications
      summary: Mark all notifications as read
      description: |
        Marks every unread notification for the authenticated user as read.
        This is the bulk operation behind the "Mark all as read" UI affordance.
        Idempotent — calling when all notifications are already read returns 200.

        **Rate limit:** 120 requests/minute.
        **Auth:** Bearer token required.
      responses:
        '200':
          description: All notifications marked as read.
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - marked_count
                properties:
                  message:
                    type: string
                    example: All notifications marked as read.
                  marked_count:
                    type: integer
                    description: Number of notifications that were transitioned
                      from unread to read by this operation.
                    example: 3
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalError'

  /notifications/{id}/read:
    patch:
      operationId: mark_notification_read
      tags:
        - Notifications
      summary: Mark a single notification as read
      description: |
        Marks the specified notification as read. Idempotent — marking an
        already-read notification returns 200 with no state change.

        **Rate limit:** 120 requests/minute.
        **Auth:** Bearer token required.
      parameters:
        - $ref: '#/components/parameters/NotificationIdPath'
      responses:
        '200':
          description: Notification marked as read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Notification does not belong to the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: FORBIDDEN
                  message: You do not have permission to access this notification.
                  request_id: req_01J9XK234PQRSTUVWXYZ
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'

  /notifications/{id}:
    delete:
      operationId: delete_notification
      tags:
        - Notifications
      summary: Dismiss and delete a notification
      description: |
        Permanently deletes the specified notification from the user's feed.
        This is the "dismiss" action. Idempotent — deleting an already-deleted
        notification returns 200.

        **Rate limit:** 120 requests/minute.
        **Auth:** Bearer token required.
      parameters:
        - $ref: '#/components/parameters/NotificationIdPath'
      responses:
        '200':
          description: Notification dismissed and deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Notification dismissed.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Notification does not belong to the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: FORBIDDEN
                  message: You do not have permission to delete this notification.
                  request_id: req_01J9XK234PQRSTUVWXYZ
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'

  # ============================================================================
  # ADMIN
  # ============================================================================

  /admin/users:
    get:
      operationId: admin_list_users
      tags:
        - Admin
      summary: List all platform users
      description: |
        Returns a paginated list of all registered users on the platform.
        Includes admin-only fields (`paper_count`, `total_chats`,
        `last_active_at`) not exposed in the standard user profile.

        Supports filtering by role, email verification status, and free-text
        search across name and email.

        **Access:** Admin role required (`role: admin` in JWT).
        **Rate limit:** 120 requests/minute.
        **Auth:** Bearer token required.
      parameters:
        - name: q
          in: query
          required: false
          description: Search by name or email (partial match).
          schema:
            type: string
            maxLength: 200
          example: aisha
        - name: role
          in: query
          required: false
          description: Filter by user role.
          schema:
            type: string
            enum:
              - user
              - admin
          example: user
        - name: email_verified
          in: query
          required: false
          description: Filter by email verification status.
          schema:
            type: boolean
          example: true
        - name: sort
          in: query
          required: false
          description: Field to sort results by.
          schema:
            type: string
            enum:
              - created_at
              - last_active_at
              - paper_count
              - total_chats
            default: created_at
          example: created_at
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
          example: desc
        - $ref: '#/components/parameters/CursorQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: User list retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUsersListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/users/{id}:
    get:
      operationId: admin_get_user
      tags:
        - Admin
      summary: Get full user detail (admin)
      description: |
        Returns the complete admin-level user record for the specified user,
        including activity metrics not available in the standard profile endpoint.

        **Access:** Admin role required.
        **Rate limit:** 120 requests/minute.
        **Auth:** Bearer token required.
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        '200':
          description: User detail retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserRecord'
              example:
                user_id: 01J9XK111USERUUID
                name: Dr. Aisha Patel
                email: aisha.patel@university.edu
                avatar_url: https://gravatar.com/avatar/abc123
                institution: MIT CSAIL
                role: user
                email_verified: true
                created_at: "2025-01-15T10:30:00Z"
                paper_count: 47
                total_chats: 312
                last_active_at: "2025-03-10T14:22:00Z"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      operationId: admin_delete_user
      tags:
        - Admin
      summary: Ban or delete a user account (admin)
      description: |
        Permanently deletes the specified user account and invalidates all
        active sessions. The user's `saved_papers`, `tags`, `collections`,
        `chat_messages`, and `notifications` records are cascade-deleted.

        Global paper records and RAG indexes contributed by this user are
        **not** deleted — they remain available to other platform users. The
        `uploaded_by` field on affected papers is set to null.

        This action is irreversible. Use with caution.

        **Access:** Admin role required. An admin cannot delete their own
        account via this endpoint (returns 403).
        **Rate limit:** 120 requests/minute.
        **Auth:** Bearer token required.
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        '200':
          description: User account deleted and all sessions invalidated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: User account deleted. All sessions invalidated. Global
                  paper records contributed by this user are retained.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: |
            Insufficient permissions, or attempting to delete own admin account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: FORBIDDEN
                  message: Admins cannot delete their own account via this endpoint.
                  request_id: req_01J9XK234PQRSTUVWXYZ
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/papers:
    get:
      operationId: admin_list_papers
      tags:
        - Admin
      summary: List all platform papers (admin)
      description: |
        Returns a paginated list of all paper records on the platform regardless
        of which user introduced them. Returns the full `PaperDetail` shape,
        including the `uploaded_by` field hidden from regular users.

        Supports filtering by `rag_status`, `source`, and free-text search
        across title and authors.

        **Access:** Admin role required.
        **Rate limit:** 120 requests/minute.
        **Auth:** Bearer token required.
      parameters:
        - name: q
          in: query
          required: false
          description: Search by title or author name.
          schema:
            type: string
            maxLength: 500
          example: attention mechanism
        - name: rag_status
          in: query
          required: false
          description: Filter by RAG pipeline status.
          schema:
            $ref: '#/components/schemas/RagStatus'
          example: failed
        - name: source
          in: query
          required: false
          description: Filter by ingestion source.
          schema:
            type: string
            enum:
              - upload
              - external_api
          example: upload
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - created_at
              - title
              - year
              - rag_status
            default: created_at
          example: created_at
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
        - $ref: '#/components/parameters/CursorQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Platform paper list retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPapersListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/papers/{id}:
    delete:
      operationId: admin_delete_paper
      tags:
        - Admin
      summary: Hard delete a paper and its RAG index (admin)
      description: |
        Permanently deletes the global paper record, its associated file from
        storage, its RAG vector index, all chunk records, and all chat sessions
        and messages associated with this paper across all users.

        All `saved_papers` records referencing this paper are cascade-deleted,
        removing it from every user's library simultaneously.

        This action is irreversible and affects all platform users who have
        this paper in their library. Use for content moderation only.

        **Access:** Admin role required.
        **Rate limit:** 120 requests/minute.
        **Auth:** Bearer token required.
      parameters:
        - $ref: '#/components/parameters/PaperIdPath'
      responses:
        '200':
          description: Paper, RAG index, and all associated data permanently deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Paper and all associated RAG data permanently deleted.
                  Removed from all user libraries. This action cannot be undone.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/stats:
    get:
      operationId: admin_get_stats
      tags:
        - Admin
      summary: Get full platform statistics (admin)
      description: |
        Returns the complete platform statistics object including admin-only
        fields (`active_users_7d`, `avg_rag_build_time_ms`) omitted from the
        public `GET /stats` endpoint.

        Response is cached server-side for 5 minutes, identical cache window
        to the public stats endpoint.

        **Access:** Admin role required.
        **Rate limit:** 120 requests/minute.
        **Auth:** Bearer token required.
      responses:
        '200':
          description: Full platform statistics retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformStats'
              example:
                total_users: 8241
                total_papers: 10432
                total_rags_ready: 3891
                total_conversations: 47201
                active_users_7d: 1203
                avg_rag_build_time_ms: 4820
                last_updated: "2025-03-10T14:20:00Z"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/architecture:
    get:
      operationId: admin_get_architecture
      tags:
        - Admin
      summary: Get system architecture manifest
      description: |
        Returns the static system architecture manifest as a directed graph
        (nodes + edges). Consumed by the admin frontend to render a visual
        pipeline architecture diagram.

        This is an internal ops endpoint — it is version-controlled in the
        codebase and updated manually when the platform architecture changes.
        It is intentionally excluded from any public-facing API documentation.

        The graph represents the complete platform component topology:
        FastAPI backend → PostgreSQL → Redis → pgvector → LLM API →
        embedding model → object storage → external scholar APIs.

        **Access:** Admin role required.
        **Rate limit:** 120 requests/minute.
        **Auth:** Bearer token required.
      responses:
        '200':
          description: Architecture manifest retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchitectureManifest'
              example:
                version: "1.0.0"
                nodes:
                  - id: client
                    label: Frontend Client
                    type: service
                    description: React/Next.js SPA. Communicates via REST and WebSocket.
                    tech: Next.js 14 / React 18
                  - id: api
                    label: FastAPI Backend
                    type: service
                    description: Core REST + WebSocket API. Handles auth, paper
                      management, RAG orchestration, and notification delivery.
                    tech: FastAPI 0.111 / Python 3.12
                  - id: postgres
                    label: PostgreSQL
                    type: database
                    description: Primary relational store. Users, papers, chat
                      messages, tags, collections, notifications.
                    tech: PostgreSQL 16
                  - id: pgvector
                    label: pgvector
                    type: vector_store
                    description: Vector index co-located with PostgreSQL.
                      Stores paper chunk embeddings for similarity search.
                    tech: pgvector 0.7
                  - id: redis
                    label: Redis
                    type: cache
                    description: Job queue (RAG pipeline tasks), rate limiting
                      counters, session token revocation list, stats cache.
                    tech: Redis 7.2
                  - id: storage
                    label: Object Storage
                    type: storage
                    description: Stores raw paper files. Pre-signed URLs issued
                      per request with 15-minute expiry.
                    tech: Cloudflare R2 / S3-compatible
                  - id: llm_api
                    label: LLM API
                    type: external_api
                    description: Streaming chat completions and rolling summary
                      generation.
                    tech: OpenAI GPT-4o
                  - id: embed_model
                    label: Embedding Model
                    type: model
                    description: Generates dense vector embeddings for paper chunks
                      during the embed pipeline step.
                    tech: text-embedding-3-small
                  - id: scholar_api
                    label: Scholar APIs
                    type: external_api
                    description: Federated academic search and DOI resolution.
                      OpenAlex (primary), Semantic Scholar, Unpaywall.
                    tech: OpenAlex / Semantic Scholar / Unpaywall
                  - id: pipeline_worker
                    label: RAG Pipeline Worker
                    type: service
                    description: Async worker consuming RAG jobs from Redis queue.
                      Executes parse → chunk → embed → index steps.
                    tech: Python / ARQ
